<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六十甲子籤詩 × 314親子心智健康靈藥網</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #9E2A2B;
      --primary-dark: #6E1A1B;
      --accent: #D4A373;
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #2B2D42;
      --text-muted: #6C757D;
      --border-color: #E9ECEF;
      --shadow: 0 10px 30px rgba(158, 42, 43, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Serif TC', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #6E1A1B 0%, #9E2A2B 100%);
      color: #FFF;
      text-align: center;
      padding: 40px 20px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Mode Navigation */
    .mode-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: #FFF;
      border: 2px solid #E5D9C5;
      color: var(--primary);
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn.active, .mode-btn:hover {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
      box-shadow: 0 6px 15px rgba(158, 42, 43, 0.25);
    }

    /* Categories View */
    .cat-tags {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .tag-btn {
      background: #EFEBE4;
      border: none;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .tag-btn.active {
      background: var(--accent);
      color: #FFF;
    }

    /* Grid Layout */
    .poem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .poem-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .poem-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(158, 42, 43, 0.15);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .poem-tag {
      background: #F8F1E7;
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .poem-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .poem-preview {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 10px 0;
      line-height: 1.5;
    }

    .card-footer {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-align: right;
    }

    /* Draw Mode Animated Section */
    .draw-section {
      text-align: center;
      padding: 50px 20px;
      background: #FFF;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 500px;
      margin: 0 auto;
    }

    .tube-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      display: inline-block;
    }

    .shaking {
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      75% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); }
    }

    .draw-btn {
      background: linear-gradient(135deg, #9E2A2B, #6E1A1B);
      color: #FFF;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(158, 42, 43, 0.3);
      transition: 0.3s;
    }

    .draw-btn:hover {
      transform: scale(1.05);
    }

    /* Search Bar */
    .search-box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 30px;
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid #E2D9CC;
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(158, 42, 43, 0.15);
    }

    /* Modal Overlay & Improved Sticky Close Button */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-card {
      background: #FFF;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      border-radius: var(--radius);
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      position: relative;
    }

    .modal-header {
      background: linear-gradient(135deg, #6E1A1B, #9E2A2B);
      color: #FFF;
      padding: 22px 60px 22px 25px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.4);
      color: #FFF;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      z-index: 20;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: scale(1.1);
    }

    .modal-body {
      padding: 25px 30px 35px;
    }

    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
      border-bottom: 2px solid #F3E9DD;
      padding-bottom: 6px;
      margin: 20px 0 12px;
    }

    .trans-list {
      list-style: none;
    }

    .trans-item {
      background: #FAF7F2;
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .trans-orig {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .trans-explain {
      font-size: 0.95rem;
      color: #333;
    }

    .article-box {
      background: #F4F8F5;
      border: 1px solid #D8EAD9;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 8px;
    }

    .article-title {
      font-weight: 700;
      color: #2D6A4F;
    }

    .action-btn-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .copy-btn {
      flex: 2;
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .copy-btn:hover {
      background: var(--primary-dark);
    }

    .bottom-close-btn {
      flex: 1;
      background: #EFEBE4;
      color: var(--text-main);
      border: 1px solid #D2C7B8;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .bottom-close-btn:hover {
      background: #E0D7C8;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2B2D42;
      color: #FFF;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      z-index: 2000;
    }
  </style>
</head>
<body>

  <header>
    <h1>六十甲子籤詩 × 314親子心智健康靈藥網</h1>
    <p>結合傳統籤詩智慧與兒青精神醫學、腦科學與 314 知識庫實證教養指引</p>
  </header>

  <div class="container">
    <!-- Mode Navigation -->
    <div class="mode-nav">
      <button class="mode-btn active" onclick="switchMode('category', event)">🎯 痛點半引導對焦</button>
      <button class="mode-btn" onclick="switchMode('draw', event)">🔮 誠心求籤／今日靈藥</button>
      <button class="mode-btn" onclick="switchMode('search', event)">🔍 全 60 籤搜尋目錄</button>
    </div>

    <!-- Category Mode View -->
    <div id="view-category">
      <div class="cat-tags">
        <button class="tag-btn active" onclick="filterCategory('ALL', event)">🌟 全部主題</button>
        <button class="tag-btn" onclick="filterCategory('學習與拖延', event)">🎒 學習與拖延</button>
        <button class="tag-btn" onclick="filterCategory('情緒與對立', event)">😡 情緒與對立</button>
        <button class="tag-btn" onclick="filterCategory('同儕與霸凌', event)">🤝 同儕與霸凌</button>
        <button class="tag-btn" onclick="filterCategory('藥物與大腦', event)">🧠 藥物與大腦</button>
        <button class="tag-btn" onclick="filterCategory('自尊與天賦', event)">🌱 自尊與天賦</button>
        <button class="tag-btn" onclick="filterCategory('家長自我關照', event)">☕ 家長自我關照</button>
      </div>
      <div class="poem-grid" id="category-grid"></div>
    </div>

    <!-- Draw Mode View -->
    <div id="view-draw" style="display: none;">
      <div class="draw-section">
        <div class="tube-icon" id="tube-icon">🎋</div>
        <h2 style="font-family: 'Noto Serif TC'; color: var(--primary); margin-bottom: 12px;">靜心默想當下教養困擾</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">誠心祈求今日的親子心智健康錦囊</p>
        <button class="draw-btn" onclick="drawPoem()">誠心搖籤</button>
      </div>
    </div>

    <!-- Search Mode View -->
    <div id="view-search" style="display: none;">
      <div class="search-box">
        <input type="text" class="search-input" id="search-input" placeholder="輸入籤號（如 1）或關鍵字（如 PACK, 拖延, 霸凌, 藥物）..." oninput="searchPoems()">
      </div>
      <div class="poem-grid" id="search-grid"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <button class="close-btn" onclick="closeModal()" title="關閉視窗">✕</button>
        <div style="font-size: 0.85rem; opacity: 0.85; margin-bottom: 4px;" id="m-cat">分類</div>
        <h2 style="font-family: 'Noto Serif TC'; font-size: 1.6rem;" id="m-header">籤號與干支</h2>
      </div>
      <div class="modal-body">
        <div class="section-title">📜 籤詩原文與逐句對譯</div>
        <ul class="trans-list" id="m-trans"></ul>

        <div class="section-title">💡 核心教養指引與腦科學解析</div>
        <h4 style="color: var(--primary); margin-bottom: 8px;" id="m-core-title">核心標題</h4>
        <p style="font-size: 0.95rem; color: #444; margin-bottom: 15px;" id="m-core-desc">描述內容</p>

        <div class="section-title">📚 建議家長延伸閱讀（314 資料庫標題與年份）</div>
        <div id="m-articles"></div>

        <div class="action-btn-group">
          <button class="copy-btn" onclick="copyPrescription()">📋 複製文字處方</button>
          <button class="bottom-close-btn" onclick="closeModal()">關閉錦囊</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已成功複製教養處方至剪貼簿！</div>

  <script>
    const POEMS_DATA = [{"id": 1, "header": "第一籤【甲子】", "category": "學習與拖延", "orig": ["日出便見風雲散", "光明清淨照世間", "一向前途通大道", "萬事清吉保平安"], "trans": ["🌸 （當大腦逐漸成熟、大人理解發育延緩的本質時，眼前的焦慮迷霧自然會散去）", "✨ （孩子獨特的光芒與優勢能力，會在清淨、安全的環境支持下被看見）", "🛣️ （只要建立結構化習慣與輔具，孩子成長的道路就會越走越寬廣順暢）", "🛡️ （不急於求成、用溫和堅定的態度陪伴，孩子自然能平安自信地成長）"], "core_title": "【給大腦成熟的時間，建立結構化鷹架】", "core_desc": "ADHD 孩子的腦前額葉發展平均比同齡慢 2~3 年。家長常因眼前的拖延、遺忘感到焦慮（如烏雲遮日）。但這不是孩子壞，而是大腦執行功能尚未成熟。只要大人不放棄，持續提供適當的環境支持，大腦發育成熟後自然能邁向康莊大道。", "articles": [{"title": "ADHD 小朋友的書包、抽屜是大黑洞!!!", "year": "2019年"}, {"title": "ADHD維持投入的秘訣", "year": "2019年"}]}, {"id": 2, "header": "第二籤【甲戌】", "category": "自尊與天賦", "orig": ["於今此景正當時", "看看欲吐百花魁", "若能遇得春色到", "一洒清吉脫塵埃"], "trans": ["❄️ （目前孩子正處於學習或情緒最艱難的寒冬瓶頸期）", "🌹 （這也是大腦與性格含苞待放、準備突破的關鍵時刻）", "🌿 （只要給予適當的『可控性』支持與春風般的理解）", "☀️ （孩子就能擺脫無助感，展現驚人的神經韌性與成果）"], "core_title": "【打破「習得無助」：注入可控性，激發韌性】", "core_desc": "當孩子說「被退學也沒差」時，是不可控挫折引發的「習得無助」。只要讓孩子感受到「事情是我可以控制的」，大腦內側前額葉（mPFC）就會啟動煞車與韌性迴路。", "articles": [{"title": "「被退學也沒差」：從無助到韌性的希望", "year": "2026年"}]}, {"id": 3, "header": "第三籤【甲申】", "category": "家長自我關照", "orig": ["勸君把定心莫虛", "天註衣祿自有餘", "和合重重常吉慶", "時來終遇得明珠"], "trans": ["⚓ （勸父母教養心態要堅定，切莫因為焦慮或討好孩子而搖擺不定）", "🎁 （孩子本身具備足夠的潛力與天賦，不必過度恐慌未來）", "❤️ （維持溫和且充滿愛的家庭氛圍與關係連結）", "💎 （堅持健康的界線，時機成熟自然能養成高自控力的明珠）"], "core_title": "【擺脫「過度通融」：建立權威型教養】", "core_desc": "家長常因害怕破壞關係而退讓（過度通融 Over Accommodation），導致孩子行為升級。權威型教養的核心是「接納所有感受（和合），但堅定行為界線（把定心）」。", "articles": [{"title": "維持和平的代價：我越忍讓，孩子越失控？", "year": "2026年"}]}, {"id": 4, "header": "第四籤【甲午】", "category": "情緒與對立", "orig": ["風恬浪靜可行舟", "恰是中秋月一輪", "凡事不須多憂慮", "福祿自有慶家門"], "trans": ["⛵ （當家庭大氣壓力和緩、情緒風浪平息時，教養之舟才能順暢前行）", "🌕 （如同中秋明月般，維持溫暖、圓滿且具安全感的家庭關係）", "🧘 （大人不必陷入災難化思考與預期焦慮，把自己逼得太緊）", "🏡 （父母先學會平靜放鬆，孩子的身心健康與好運自然隨之而來）"], "core_title": "【做家長的情緒絕緣體：大人平靜，孩子的風浪自然平息】", "core_desc": "孩子的情緒暴怒常傳染給大人。當家長陷入災難化思考時，焦慮便瀰漫全家。大人的平靜就是孩子大腦最好的調節器。", "articles": [{"title": "【孩子怒了😡，爸媽也火了😤—談兒童情緒控制】", "year": "2020年"}]}, {"id": 5, "header": "第五籤【甲辰】", "category": "同儕與霸凌", "orig": ["只恐前途命有變", "勸君作急可宜先", "且守長江無大事", "命逢太白守身邊"], "trans": ["⚠️ （擔心衝動或不可預期的行為造成衝擊時，需要有先見之明）", "🛑 （凡事預先準備與提示，但做事切忌急燥衝動，欲速則不達）", "🏰 （穩穩守住家庭日常的結構、界線與安全底線）", "🌟 （善用醫療、學校與家長擔任的「貴人/社交經紀人」相助）"], "core_title": "【教養切忌急就章：善用「社交經紀人」與外在貴人】", "core_desc": "ADHD 孩子的改變無法急就章。家長需預先提示（如 STOP 口訣）。同時不要單打獨鬥，家長應扮演孩子的「社交名聲經紀人」，協助打破同儕標籤。", "articles": [{"title": "ADHD的自我控制能力", "year": "2019年"}, {"title": "為何孩子乖乖吃藥、上了社交課，人緣還是沒變好？打破 ADHD 社交困境的迷思", "year": "2025年"}]}, {"id": 6, "header": "第六籤【甲寅】", "category": "同儕與霸凌", "orig": ["風雲致雨落洋洋", "天災時氣必有傷", "命內此事難和合", "更逢一足出外鄉"], "trans": ["🌧️ （當孩子在學校遭遇人際風暴、被欺負或同儕衝突落入低谷時）", "💔 （長期的欺凌確實會在孩子大腦留下記號，造成壓力和情感創傷）", "🚫 （此時切忌教孩子直接暴力反擊或硬碰硬，那無法從根本解決問題）", "🤝 （應主動尋求校方、醫療與家庭三方合作，建立正向安全的外在支持）"], "core_title": "【應對校園欺凌：建立安全依附，拒絕暴力反擊】", "core_desc": "被欺負經驗會增加孩子大腦對壓力的敏感度。教導孩子直接反擊若沒效會更無助，若有效則會習得暴力。解決之道在於強化親子溝通、增進自尊韌性，並主動與學校系統合作。", "articles": [{"title": "孩子在學校長期遭受欺負的處理策略", "year": "2024年"}]}, {"id": 7, "header": "第七籤【辛亥/庚戌】", "category": "藥物與大腦", "orig": ["雲開月出正分明", "不須進退問前程", "婚姻皆由天註定", "和合清吉萬事成"], "trans": ["🌕 （過去困擾的症狀與混亂逐漸明朗，大腦神經網絡重現光明）", "🚶 （不必再迷惘猶豫或到處求醫問卜，堅持正向的醫療與教養方向即可）", "🧬 （理解生理發展與基因特質有其自然規律，尊重孩子的發育節奏）", "✨ （配合適當的藥物與環境調整，神經連結便能順利發育完成）"], "core_title": "【藥物機轉與大腦發育：正確治療促進神經髓鞘成熟】", "core_desc": "最新神經學 MRI 研究（荷蘭團隊）發現，ADHD 兒童在發育階段接受 MPH（利他能）治療，其大腦白質（神經纖維路徑）有顯著增加與成熟。藥物能提升多巴胺/正腎上腺素信噪比，幫助大腦發展。", "articles": [{"title": "MPH( 利他能) 藥物對大腦的影響", "year": "2019年"}, {"title": "治療ADHD藥物的作用機轉", "year": "2019年"}]}, {"id": 8, "header": "第八籤【辛丑】", "category": "自尊與天賦", "orig": ["禾稻看看結成完", "此事必定兩相全", "回到家中寬心坐", "妻兒鼓舞樂團圓"], "trans": ["🌾 （經過漫長的耕耘與理解，孩子內在的天賦與能力終於看到結實纍纍的曙光）", "☯️ （只要找到適合的舞台，學習成效與孩子的快樂自信是可以兩全其美的）", "☕ （大人放鬆心情，不必再強求孩子盲目跟別人比較）", "🎉 （全家一起看見孩子的優勢，共享家庭的和樂與成就感受）"], "core_title": "【多元智力理論：發掘孩子強處，停止無效追趕】", "core_desc": "依據 H. Gardner 多元智力理論，每個人有不同的智力組合（語言、動作、人際等）。特教的核心是發掘強處。若只逼孩子苦苦追趕弱項，就算趕上也沒有成就感，反而磨滅學習動機。", "articles": [{"title": "對事情不感興趣怎麼辦？（發掘孩子強處）", "year": "2022年"}]}, {"id": 9, "header": "第九籤【壬申】", "category": "同儕與霸凌", "orig": ["龍虎相隨在深山", "君爾何須背後看", "不知此去相愛愉", "他日與我卻無干"], "trans": ["🐅 （孩子在學校的同儕環境中，常夾雜著各種複雜的人際衝突與考驗）", "🔍 （家長不必只看表面的是非題，而要深入觀察孩子真實的人際互動）", "🤝 （辨識孩子說『全班都是好朋友』到底是一時歡樂還是表面指派）", "💔 （避免孩子陷入孤立不安，誤把『場域分配的朋友』當作真正的精神寄託）"], "core_title": "【同儕人際辨識：區分「分配的朋友」與「真正的友誼」】", "core_desc": "少子化讓同儕關係更關鍵。但有些「學校的朋友」只是因為同班被指派，不具備深刻聯繫。若孩子說「全班都是好朋友」或「只跟一個人好」，可能是孤立的訊號。家長需要主動關心質化互動。", "articles": [{"title": "孩子的朋友是「分配」 來的嗎?", "year": "2023年"}]}, {"id": 10, "header": "第十籤【癸酉】", "category": "家長自我關照", "orig": ["花開結子一半枯", "可惜今年汝虛度", "漸漸日落西山去", "勸君不用向前途"], "trans": ["🥀 （孩子看似學習效率低落、成果大打折扣，讓人感到可惜）", "⏳ （並非孩子白費光陰，而是大腦超載當機，無法再容納更多資訊）", "🌙 （當認知資源耗盡時，硬逼著學習只會造成強烈的逃避與厭惡情緒）", "🛑 （勸大人暫停無效的強迫，學會大腦『主動遺忘』與過濾的藝術）"], "core_title": "【認知科學：大腦不是設計來思考，而是來避免思考的】", "core_desc": "認知心理學（Willingham）指出：「大腦其實是設計來避免思考的」。當背景知識不足或認知負荷超出工作記憶時，大腦會本能尋求省力替代。此外，大腦也需要主動「遺忘」來清理記憶體。", "articles": [{"title": "大腦不是設計來思考，而是來避免思考的", "year": "2024年"}, {"title": "學會放手，大腦才能輕盈呼吸：談談遺忘的藝術", "year": "2024年"}]}, {"id": 11, "header": "第十一籤【乙卯】", "category": "學習與拖延", "orig": ["靈雞漸漸見分明", "凡事且看子丑寅", "雲開月出照天下", "郎君即便見太平"], "trans": ["🐓 （黑夜即將過去，如靈雞報曉般，孩子克服拖延的改變契機已逐漸清晰）", "⏳ （學習與行為的改善需要時間累積，順應大腦神經調節的生理時序）", "🌕 （當拖延的習慣被破除後，孩子原本具備的才華與自信將如月光般展照）", "🕊️ （家庭與親子關係不再每日為寫作業爭吵，重新恢復平靜與安寧）"], "core_title": "【借鏡戒酒12步驟：承認困難、破除拖延惡性循環】", "core_desc": "拖延是一種迴避焦慮的壞習慣。當孩子面對寫作業的心煩時，開啟手機或分心能立即緩解焦慮，因而形成強烈的行為依賴。戒除拖延需要像「戒酒12步驟」一樣：第一步承認自己遇到困難、第二步許下改變希望、第七步謙卑求助並改變環境（如離開封閉房間或移除干擾源）。", "articles": [{"title": "運用戒酒12步驟 改善 ADHD拖延問題", "year": "2019年"}]}, {"id": 12, "header": "第十二籤【乙巳】", "category": "情緒與對立", "orig": ["長江風浪漸漸靜", "于今得進可安寧", "必有貴人相扶助", "凶事脫出見太平"], "trans": ["🌊 （孩子與家長心中累積的情緒風浪，正逐漸獲得撫平與平息）", "🧘 （當下正是啟動正向溝通、建立安心陪伴與正念練習的好時機）", "🤝 （身邊有專業心理師、醫師與學校輔導系統作為堅強的貴人後盾）", "🌈 （過去親子對立、兩敗俱傷的衝突凶局將順利解套，迎來和平）"], "core_title": "【大聲喘息與情緒絕緣：逢凶化吉的情緒控制】", "core_desc": "當孩子發脾氣時，家長常手足無措，甚至連自己的情緒也隨之高漲造成兩敗俱傷。大人必須先練習自我情緒管理，允許孩子的生氣反應，暫時扮演「情緒絕緣體」。深呼吸讓怒氣降溫，必要時運用「離開現場」技巧，並告知孩子會再回來，給彼此寧靜空間。", "articles": [{"title": "心情溫度計【孩子怒了😡，爸媽也火了😤—談兒童情緒控制】", "year": "2020年"}]}, {"id": 13, "header": "第十三籤【乙未】", "category": "情緒與對立", "orig": ["命中正逢羅孛關", "用盡心機總未休", "作福問神難得過", "恰是行舟上高灘"], "trans": ["⚡ （孩子目前正處於大腦情緒過載、如逢凶星羅孛般的困頓瓶頸）", "🌀 （大人光是用講道理、責備或懲罰，只會讓內耗與對立持續不斷）", "⛩️ （單靠焦慮求神或期望孩子自己突然變好，無法解決生理性的困難）", "⛵ （如同船隻卡在沙灘進退兩難，需要重新理解孩子背後的述情障礙）"], "core_title": "【突破進退兩難：理解孩子的「述情障礙（Alexithymia）」】", "core_desc": "許多衝動暴怒或退縮拒學的孩子，背後存在「述情障礙」——無法用言語精準識別與表達內心複雜的焦慮與身體感受，只能轉化為行為失控。當家長用盡心機仍未休時，應停止無效說理，協助孩子建立情緒詞彙卡，從底層解鎖內心困境。", "articles": [{"title": "述情障礙 Alexithymia 與兒童情緒表達困境", "year": "2020年"}]}, {"id": 14, "header": "第十四籤【乙酉】", "category": "學習與拖延", "orig": ["財中漸漸見分明", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🪙 （學習成果與行為改變的價值，正隨著時間一步步明確顯現）", "🌸 （經歷挫折花謝與努力花開，大腦神經網絡終能結出豐碩果實）", "🌕 （大人放寬心保持耐心，給予即時的回饋與正向強化）", "✨ （只要願意充實自己、踏實耕耘，孩子必能邁向自信平順）"], "core_title": "【大腦「時間折價」與行為改變技術（DRC/CICO）】", "core_desc": "ADHD 孩子的內部生理時鐘不穩定，對「遠期目標」容易發生時間折價（覺得沒價值）。這首籤詩強調「一分耕耘一分收穫，寬心且看月中桂」。家長可運用每日行為報告卡（DRC）與簽到退系統（CICO），提供即時的外部獎勵回饋，驅動大腦行為改變。", "articles": [{"title": "克服拖延的 12步驟與每日行為報告卡 DRC 實踐", "year": "2021年"}]}, {"id": 15, "header": "第十五籤【乙亥】", "category": "自尊與天賦", "orig": ["八十原來是太公", "看看晚景遇文王", "目下緊事休相問", "勸君且守待運通"], "trans": ["🎣 （如同姜太公八十歲才遇文王，每個孩子的發展都有屬於自己的時序）", "👑 （只要不放棄充實強項，終會遇見懂孩子天賦的伯樂與時機）", "🛑 （眼前的考試名次或一時落後不必過度追問，避免造成二次傷害）", "🌟 （穩健培養優勢能力與自信心，大腦成熟時自然發光發熱）"], "core_title": "【大器晚成：發掘強項，等待大腦發育的時序】", "core_desc": "抽得此籤表示目前做事總不如意，但這不是因為孩子不努力，而是發育時機未到。最重要的事是「發掘並充實孩子的強處」。只要具備優勢能力，絕不會被埋沒。", "articles": [{"title": "ADHD 孩子的學習策略：設定目標，分解任務，刻意練習", "year": "2019年"}]}, {"id": 16, "header": "第十六籤【丙子】", "category": "藥物與大腦", "orig": ["不須作福不須求", "用盡心機總未休", "陽世不知陰世事", "官法如爐不自由"], "trans": ["⛩️ （不必盲目求神問卜或強求奇蹟，順應自然的生理規律才是正道）", "🤯 （若違背大腦睡眠與發育節律，再多補習或嚴厲管教也是徒勞無功）", "🌙 （大人常不了解大腦在夜間睡眠時進行的神經排毒與記憶鞏固）", "⚖️ （大腦生理時鐘與警醒系統有其嚴格規律，無法憑意志力強行扭轉）"], "core_title": "【順應大腦生理時律：睡眠債務與注意力調控】", "core_desc": "許多注意力不集中與情緒易怒，根本原因在於「睡眠債務」與生理時鐘失調。大腦在睡眠時會清除代謝廢物並進行突觸修剪。若忽視睡眠品質與警醒系統（Arousal System）的規律，任何學習訓練都事倍功半。", "articles": [{"title": "揭開孩子入睡之謎：生理時鐘、警醒系統、睡眠債務你知多少？", "year": "2021年"}]}, {"id": 17, "header": "第十七籤【丙寅】", "category": "家長自我關照", "orig": ["舊恨重重未改為", "家中禍患不臨身", "須當謹防宜作福", "龍蛇交會得和合"], "trans": ["💔 （過去經歷的多次失敗、挫折與心酸，不必一直耿耿於懷）", "🏠 （家庭是孩子最終的安全堡壘，只要家在，傷害就不會擴大）", "🛡️ （謹慎保護孩子的自尊心，多做正向累積與善意連結）", "🐉 （在關鍵的轉折時刻（如升學、跨階段），親子修復終能和合逢凶化吉）"], "core_title": "【創傷修復：建構家庭安全堡壘與非批判式接納】", "core_desc": "長期的失敗經驗會在大腦留下創傷記號。即使經歷無數次辛酸，也不必耿耿於懷。家長要振作起來，保持心地善良與非批判式的接納，多給予正面肯定，帶領孩子化險為夷。", "articles": [{"title": "長期嚴重精神創傷會不會導致注意力不集中，易怒？", "year": "2024年"}]}, {"id": 18, "header": "第十八籤【丙辰】", "category": "同儕與霸凌", "orig": ["君問中間此言因", "看看祿馬拱前程", "若得貴人多得利", "和合自有兩分明"], "trans": ["❓ （探究孩子行為問題背後的原因，會發現善意與心田才是根本）", "🐎 （孩子內在的好心腸與優點，將會吸引身邊貴人相助前程）", "🤝 （獲得學校老師、醫師與同儕貴人的正向支持，事半功倍）", "☀️ （家庭和睦與正向行為支持相輔相成，成果自然清析分明）"], "core_title": "【正向行為支持 (PBS) 與 4:1 讚美修正法則】", "core_desc": "孩子心田善良，善心自會有善報。在進行行為矯正時，家長應運用「正向行為支持（PBS）」。在朋友與同儕面前，維持「4 個讚美：1 個修正」的黃金比例，幫孩子做面子，引導貴人相助。", "articles": [{"title": "家長友誼教練（PFC）與 4:1 讚美修正法則", "year": "2025年"}]}, {"id": 19, "header": "第十九籤【丙午】", "category": "學習與拖延", "orig": ["富貴由命天註定", "心高必然誤君期", "不然且回依舊路", "雲開月出自分明"], "trans": ["⚖️ （每個孩子的資質與大腦特質各有不同，切忌好大喜功）", "⚠️ （若目標設定太高、不切實際，反而會耽誤了孩子正常的發展節奏）", "踏 （不如回歸踏實的基本功，依循孩子的步調一步一腳印進行）", "🌕 （只要按部就班累積小目標，雲開月出後成功自然分明）"], "core_title": "【避免好高騖遠：合理的目標設定與工作分析】", "core_desc": "野心太大或期望過高反會招致失敗。同樣的努力不一定有同樣的結果，明理的家長不要奢求孩子一躍登頂。應將任務化整為零，進行「工作分析（Task Analysis）」，設定合理可達成的目標。", "articles": [{"title": "ADHD維持投入的秘訣：明確目標與多步驟變化", "year": "2019年"}]}, {"id": 20, "header": "第二十籤【丙申】", "category": "家長自我關照", "orig": ["前人積德後人收", "積善之家必有餘", "娶妻生子身安樂", "命逢太白多吉慶"], "trans": ["🌳 （家長與老師早期的細心輔導與習慣培養，將成為孩子未來的福報）", "🏡 （建立充滿愛與支持的家庭系統，能為孩子提供長期保護力量）", "👨‍👩‍👧 （良好的早期介入能讓孩子長大後生活安樂，建立健康的人際與家庭）", "🌟 （早期建立專業醫療與特教防護網，人生必能多獲吉慶平安）"], "core_title": "【早期診斷與早療：建構跨系統家庭防護網】", "core_desc": "前人種樹後人乘涼。在兒童發育早期發現疑似 ADHD 或發展問題，早期進行環境調整與就醫評估，能避免青少年時期的挫折與對立。建立家長、老師、醫師共組的防護網，是給孩子最好的禮物。", "articles": [{"title": "ADHD 早期診斷與就醫流程：家長與老師的防護網", "year": "2021年"}]}, {"id": 21, "header": "第二十一籤【丁亥】", "category": "自尊與天賦", "orig": ["十方佛羽讚君卿", "歡喜冤家自相爭", "看君早晚見太平", "榮華富貴得安寧"], "trans": ["🌟 （孩子的優點與特質，值得獲得眾人的看見、肯定與讚美）", "🤝 （親子之間雖有意見分歧與小衝突，但這也是深化理解的契機）", "☀️ （只要採用正向關注，親子關係與人際互動早晚會邁向和諧）", "🏆 （建立自信的孩子能在社會中發揮潛能，享受內心的安寧與成就）"], "core_title": "【聚光燈策略：用正向關注翻轉社交標籤】", "core_desc": "孩子在同儕中常因過動或衝動被貼上「愛搗蛋」的單一標籤。家長應扮演名聲經紀人，使用「聚光燈策略」——在老師或其他家長面前刻意提及孩子的優點（如樂高很強、對小動物溫柔）。當周遭環境開始讚賞孩子，好印象就能取代舊偏見。", "articles": [{"title": "打破 ADHD 社交困境：聚光燈策略與正向名聲", "year": "2025年"}]}, {"id": 22, "header": "第二十二籤【丁丑】", "category": "家長自我關照", "orig": ["太公家業八十成", "月出光輝照大庭", "心下莫慌宜作福", "未來順利得安寧"], "trans": ["⏳ （如同姜太公八十歲才成就大業，神經發展與特質調適需要時間熟成）", "🌕 （積累的實力終會在適當的時機大放異彩，照亮屬於孩子的舞台）", "🧘 （家長切莫焦慮恐慌，保持安心陪伴並建立正向支持環境）", "🌈 （尊重孩子的發展時序，未來的學習與生活自然平順安寧）"], "core_title": "【大器晚成：關注女性與成人 ADHD 的隱性困境】", "core_desc": "有些孩子（特別是女性 ADHD）因為沒有明顯的過動行為，小時候常被誤認為「害羞」或「不專心」，直到長大或成年後才被正確診斷。家長不必急於一時的爆發，只要持續提供支持，大腦發育成熟後依然能成就不凡。", "articles": [{"title": "女性 ADHD 漏診與成人 ADHD 職場與生活調適", "year": "2023年"}]}, {"id": 23, "header": "第二十三籤【丁卯】", "category": "家長自我關照", "orig": ["欲去長江水浪急", "行舟陸上未安全", "寬心且在沙灘坐", "聽得雷聲笑歡顏"], "trans": ["🌊 （當孩子面對升學壓力、同儕排擠或學校風浪，情緒極度不安時）", "⚠️ （此時若硬逼孩子頂風前行或強迫上學，往往會造成心理崩潰）", "☕ （不如先讓孩子在安全的沙灘上暫停、休息，修復過載的神經系統）", "🌩️ （等到情緒風暴過去、安全感重建後，孩子就能重拾笑容迎向挑戰）"], "core_title": "【拒學與社交焦慮：給予安全避風港，暫停無效強迫】", "core_desc": "拒學與網路成癮背後，常隱藏著強烈的社交焦慮與無力感。當水浪太急時，硬推孩子向前只會加重對立。家長應「寬心且在沙灘坐」，提供無條件接納的家庭避風港，等杏仁核冷卻後再引導孩子逐步回歸。", "articles": [{"title": "拒學、社交焦慮與網路成癮背後的心理根源", "year": "2023年"}]}, {"id": 24, "header": "第二十四籤【丁巳】", "category": "自尊與天賦", "orig": ["月出光輝本清吉", "浮雲總是蔽陰色", "戶內安心寬處坐", "雲開月出照天下"], "trans": ["🌕 （孩子的大腦天生充滿對世界的好奇與探索本能，本質純真美好）", "☁️ （不當的環境壓力和無效的重複處罰，就像浮雲般遮蔽了孩子的動機）", "🏡 （家長在家中創造安全、不被評判的學習環境，讓孩子寬心探索）", "✨ （當傷害動機的因子被移除後，孩子內在的好奇光芒自會綻放）"], "core_title": "【保護孩子的探索本能：移除傷害學習動機的因子】", "core_desc": "ADHD 孩子從不缺乏動機！他們會研究旋轉椅、探索地板聲音，對世界充滿好奇。但隨著年級增加，苦苦追趕一般標準的挫折讓動機消失了。重點不是如何「改變孩子」，而是大人如何「避免繼續傷害動機」，建立安全的學習環境。", "articles": [{"title": "為什麼孩子不愛上學？從大腦學習機制找到答案", "year": "2022年"}]}, {"id": 25, "header": "第二十五籤【丁未】", "category": "學習與拖延", "orig": ["總是前途莫心勞", "求神問卜枉徒勞", "官法如爐不自由", "施主寬心坐高樓"], "trans": ["🧘 （父母與孩子都不必為未知的將來過度心勞內耗、焦慮不安）", "⛩️ （單靠求神或隨波逐流報名大量補習班，無法根治大腦的負荷過載）", "⚖️ （大腦的工作記憶容量有限，超載時本能就會選擇省力逃避）", "☕ （大人放寬心適度放手，教導孩子主動遺忘與清理大腦垃圾）"], "core_title": "【遺忘的藝術：主動過濾資訊，減輕大腦超載】", "core_desc": "很多人不是記憶不好，而是無法有效率地「忘記」。無用訊息占用記憶體時大腦就會當機。遺忘是大腦突觸修剪的主動過程。家長應協助孩子建立心理過濾器，透過睡眠與正念清理大腦超載。", "articles": [{"title": "前額葉控制的主動遺忘：使記憶適應認知和情緒目標", "year": "2024年"}]}, {"id": 26, "header": "第二十六籤【丁酉】", "category": "自尊與天賦", "orig": ["選出預頭任君行", "高歌鼓舞樂昇平", "事和意順多吉慶", "前途光明自從容"], "trans": ["🎯 （為孩子選定適合其神經特質的發展賽道與優勢目標）", "🎉 （當孩子在擅長的領域獲得成就時，學習將變成一件快樂的事）", "🤝 （親子目標一致、環境調整得宜，生活自然充滿和樂）", "🛣️ （有了自信與優勢能力加持，孩子面對未來的挑戰就能從容不迫）"], "core_title": "【適性發展：優點被看見，孩子就會自動前進】", "core_desc": "當孩子的注意力改善、建立安全學習環境後，只要優點能被看見，基於對事物好奇的本性，孩子就能自動繼續前進學習。家長應協助孩子挑選適合的戰場，而非在劣勢項目盲目內耗。", "articles": [{"title": "當優點被看見，孩子就能自動繼續前進", "year": "2022年"}]}, {"id": 27, "header": "第二十七籤【戊子】", "category": "藥物與大腦", "orig": ["君爾寬心且自由", "物色相宜自適求", "順水推舟無不利", "前途清吉保無憂"], "trans": ["🕊️ （勸家長放寬心胸，給予孩子適度的自我管理彈性與自由）", "🧩 （尋找最適合孩子大腦特質的學習工具與輔具）", "⛵ （順應孩子的天性與發育步調，學習就像順水推舟般輕鬆）", "☀️ （不必過度操心，孩子自然能在屬於他的軌道上平安順遂）"], "core_title": "【順水推舟：輔具運用與順應天性的教養】", "core_desc": "對待 ADHD 孩子不應逆水行舟。善用「視覺化線索（標籤、顏色袋）」、「計時器（番茄鐘）」等輔具，順應孩子大腦處理訊息的特點。當教養方法與大腦特性相宜，學習自然順暢無憂。", "articles": [{"title": "做好注意力規劃，避免碎片化學習", "year": "2024年"}]}, {"id": 28, "header": "第二十八籤【戊寅】", "category": "自尊與天賦", "orig": ["於今此景正當時", "看看欲吐百花魁", "若能遇得春色到", "一洒清吉脫塵埃"], "trans": ["🌿 （現在正是調整教養方式、重建親子關係的最佳時機）", "🌸 （只要方向正確，孩子內在的潛能與良好習慣即將萌芽綻放）", "☀️ （當家庭帶來如春風般溫暖、接納且有界線的環境）", "✨ （過去因為混亂與衝突累積的負面陰霾，將一次洗滌乾淨）"], "core_title": "【移除念力作法：打造溫暖有界線的春風環境】", "core_desc": "家長應移除「吾心信其可行，則雖移山填海之難，終有成功之日」這種單靠念力的作法。真正的改變來自於環境的調整。建立安全的學習環境後，孩子自然能萌芽茁壯。", "articles": [{"title": "移除念力作法，建立安全的學習環境", "year": "2022年"}]}, {"id": 29, "header": "第二十九籤【戊辰】", "category": "自尊與天賦", "orig": ["枯木可惜逢春時", "如今好運漸漸來", "莫聽人言多短長", "時來運轉自和同"], "trans": ["🌳 （看似陷入絕望落後的枯木狀態，逢春時依然能重獲生機）", "🌈 （隨著正確的診斷、醫療與教養介入，好運與改變正步入軌道）", "👂 （不要被親戚、路人或網路未經證實的批評標籤所干擾）", "✨ （堅持實證醫療與科學教養，時機到了自然展現驚人韌性）"], "core_title": "【神經韌性：阻絕外界雜音，堅持科學教養】", "core_desc": "面對鄰居或親友對孩子的指指點點（「就是沒教好」、「長大就好了」），家長要「莫聽人言多短長」。ADHD 是生理性的神經發展議題，堅持專業醫療與實證教養，枯木逢春終有時。", "articles": [{"title": "新觀點：韌性的神經迴路與壓力免疫", "year": "2026年"}]}, {"id": 30, "header": "第三十籤【戊午】", "category": "藥物與大腦", "orig": ["漸漸脫出見太平", "推陳出新再立名", "看看欲吐百花魁", "好運必定到家門"], "trans": ["🕊️ （透過適當的藥物與行為治療，困擾許久的症狀正漸漸脫離）", "🌟 （最新醫學研究帶來新觀念，讓家長重新理解孩子大腦的運作）", "🌺 （當警醒與獎勵系統獲得平衡，孩子的專注力與能力隨之綻放）", "🏡 （全家終於擺脫混亂，迎接和諧與安寧的新篇章）"], "core_title": "【最新腦科學典範轉移：藥物對覺醒與獎勵系統的平衡】", "core_desc": "2025 年《Cell》最新神經科學研究指出，ADHD 藥物主要作用於大腦的「覺醒 (Arousal)」與「獎勵 (Reward)」區域，而非傳統說法。了解這點能幫助家長推陳出新，理解孩子為何需要過動來尋求刺激，並建立藥物主權與正確治療態度。", "articles": [{"title": "Cell 最新研究：ADHD 藥物主要作用於覺醒與獎勵區域", "year": "2025年"}]}, {"id": 31, "header": "第三十一籤【己丑】", "category": "情緒與對立", "orig": ["巽足清香得太平", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🕯️ （靜下心來、透過正念呼吸讓情緒平息，家庭自然重獲平靜）", "🌸 （接納孩子情緒如四季花開花謝般起伏，終能結出成熟果實）", "🌕 （大人放寬心給予陪伴，不必為眼前的混亂過度焦慮內耗）", "🕊️ （只要練習正念與情緒調節，親子衝突便能化解見太平）"], "core_title": "【正念呼吸 STOP 技巧：冷卻杏仁核】", "core_desc": "當孩子情緒暴怒或家長火氣上升時，最好的方法是正念 STOP 技巧：S（Stop 動作暫停）、T（Take a breath 深呼吸喝水）、O（Observe 觀察感受與心跳）、P（Process 選擇合適方法）。讓杏仁核冷卻，前額葉重新接管大腦。", "articles": [{"title": "正念呼吸 STOP 技巧與情緒調節", "year": "2020年"}]}, {"id": 32, "header": "第三十二籤【己卯】", "category": "情緒與對立", "orig": ["龍虎相交在勝敗", "貞勝貞負自相爭", "看君早晚見太平", "榮華富貴得安寧"], "trans": ["🐅 （親子之間若陷入權力鬥爭與強硬對立，只會造成雙敗局勢）", "⚔️ （大人若非要爭贏孩子，只會激化對立反抗症（ODD）的暴怒）", "🕊️ （只要放棄『這不是...而是...』的糾正句型，關係早晚會緩和）", "❤️ （用同理接納替代權力鬥爭，才能贏得真正的家庭和諧與安寧）"], "core_title": "【化解對立反抗症 (ODD)：封鎖糾正型句式】", "core_desc": "ADHD 青少年常伴隨對立反抗（ODD）。大人若與孩子硬碰硬（龍虎相爭），會強化大腦的威脅路徑。臨床教養建議：封鎖 AI 式的生硬糾正句型（如「這不是...而是...」），改用「接納感受、堅持界線」的語氣，化解對立。", "articles": [{"title": "對立反抗症 ODD 與親子衝突處方", "year": "2026年"}]}, {"id": 33, "header": "第三十三籤【己巳】", "category": "情緒與對立", "orig": ["欲求勝敗兩相全", "用盡心機總未休", "風雲致雨落洋洋", "命逢太白守身邊"], "trans": ["🤝 （尋求家長管理與孩子自主之間的雙贏解法）", "🤯 （單靠傳統嚴懲或說理，無法解決孩子底層的執行功能障礙）", "🌧️ （當衝突達到頂峰時，先退一步提供情感接納與保護）", "🌟 （採用『合作式問題解決（CPS）』，讓親子共同討論出方案）"], "core_title": "【合作式問題解決 (CPS)：從對立走向雙贏】", "core_desc": "單方面強加規定只會引發反彈。合作式問題解決（Collaborative Problem Solving）主張：先了解孩子的困難（如寫作業太累或字太難），再表達大人的關切，最後邀請孩子一起腦力激盪出兩全其美的解決方案。", "articles": [{"title": "從對立到雙贏：合作式問題解決策略", "year": "2023年"}]}, {"id": 34, "header": "第三十四籤【己未】", "category": "藥物與大腦", "orig": ["漸漸脫出見太平", "推陳出新再立名", "看看欲吐百花魁", "好運必定到家門"], "trans": ["🕊️ （透過規律的運動與生活調整，專注力與情緒困擾正漸次化解）", "🏃 （引入『運動作為第三支柱』的新觀念，為孩子的學習注入新活力）", "🌺 （大腦多巴胺獲得充份分泌後，執行功能與記憶力大幅提升）", "🏡 （身心健康獲得整體改善，家庭生活充滿活力與喜悅）"], "core_title": "【運動作為第三支柱：刺激多巴胺與前額葉活化】", "core_desc": "除了藥物與行為治療，規律的中高強度運動（特別是需要高度認知參與的運動如球類、武術）是 ADHD 治療的第三支柱。運動能直接刺激多巴胺與正腎上腺素分泌，活化前額葉皮質，提升執行功能。", "articles": [{"title": "運動作為 ADHD 治療的第三支柱：刺激多巴胺分泌", "year": "2025年"}]}, {"id": 35, "header": "第三十五籤【己酉】", "category": "學習與拖延", "orig": ["音書許字未曾真", "前途進退總無因", "戶內安心寬處坐", "雲開月出自分明"], "trans": ["🗣️ （光是用口頭說明與重複交代，對孩子的大腦而言常傳達失真）", "❓ （孩子聽完就忘、無法按步驟執行，讓大人感到摸不著頭緒）", "🖼️ （不如改用視覺化圖表與標籤，讓訊息清清楚楚陳列）", "☀️ （運用『視空繪圖板』進行補償，孩子執行的目標立刻一目了然）"], "core_title": "【工作記憶補償：用視覺化提示勝過口頭碎念】", "core_desc": "ADHD 孩子常有「語音迴路（序列記憶）」缺失，聽完三個口頭指令就會漏掉兩個。但他們的「視空繪圖板（空間視覺）」往往較強。大人應減少口頭碎念（音書未曾真），改用視覺化檢核表、照片或貼紙（清清楚楚陳列），幫大腦做補償。", "articles": [{"title": "工作記憶缺失與語音迴路 vs 視空繪圖板補償", "year": "2019年"}]}, {"id": 36, "header": "第三十六籤【庚子】", "category": "同儕與霸凌", "orig": ["福如東海壽如山", "君爾何須背後看", "不知此去相愛愉", "他日與我卻無干"], "trans": ["🌊 （建立穩固的早期依附關係，是給予孩子終身身心健康的基石）", "🛡️ （大人不必總是懷疑焦慮，只要給予足夠的安全感底線即可）", "❤️ （當孩子在大人的愛與支持下感受到安全，便能愉快探索世界）", "🕊️ （健全的依附能讓孩子安心獨立，擁有獨立面對未來的韌性）"], "core_title": "【依附理論：安全感是大腦探索世界的起點】", "core_desc": "依附理論指出，孩子透過對大人的依附獲得安全感。當需求獲得滿足時，大腦便能放心地去探索世界。反之，若在家庭中缺乏安全感，孩子常會轉向同儕尋求不成熟的連結，甚至招致人際霸凌。", "articles": [{"title": "依附理論：當孩子缺乏安全感時的轉向同儕行為", "year": "2024年"}]}, {"id": 37, "header": "第三十七籤【庚寅】", "category": "學習與拖延", "orig": ["運逢得意身康泰", "麻衣換綠柳隨風", "一向前途通大道", "萬事清吉保平安"], "trans": ["💪 （當好習慣養成、大腦運作順暢時，孩子身心自然康泰昌盛）", "🌿 （擺脫過去拖延與混亂的舊麻衣，展現隨風搖曳的新氣象）", "🛣️ （只要掌握習慣建立三要素，學習與生活大道通暢）", "🛡️ （好習慣帶來的自律與成就感，保護孩子一生順遂平安）"], "core_title": "【習慣的力量：提示、常規與獎勵迴路】", "core_desc": "習慣是在「提示、常規、獎勵」三要素中不斷增強的。拖延是一種壞習慣，因為它能立即緩解寫作業的焦慮。要建立好習慣，家長需重新設計提示（如放置書包點），簡化常規，並在完成時給予立即的正向獎勵。", "articles": [{"title": "習慣的力量：提示、常規與獎勵迴路", "year": "2019年"}]}, {"id": 38, "header": "第三十八籤【庚辰】", "category": "家長自我關照", "orig": ["名顯意揚幸運逢", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🌟 （當孩子內在的潛能與社會痛被看見與同理時，幸運隨之而來）", "🌸 （經過情感修復與耐心引導，親子關係終於結出甘甜果實）", "🌕 （家長運用『真誠同理』接住孩子的痛苦，放寬心陪伴成長）", "🕊️ （分開『行為』與『自我價值』，親子共享和諧與太平）"], "core_title": "【真誠同理 vs 表面同情：接住孩子的「社會痛」】", "core_desc": "面對受挫或拒學的孩子，家長常犯的錯誤是急著給建議或講道理（表面同情）。正確做法是運用「真誠同理」——不帶批判地接住孩子的「社會痛（Social Pain）」，將「不良行為」與「孩子的自我價值」分開，給予安全感。", "articles": [{"title": "真誠同理 vs 表面同情：接住孩子的社會痛", "year": "2025年"}]}, {"id": 39, "header": "第三十九籤【庚午】", "category": "同儕與霸凌", "orig": ["意中若問神仙事", "用盡心機總未休", "陽世不知陰世事", "官法如爐不自由"], "trans": ["⛩️ （若想尋求神仙奇蹟或偏方來一夕治癒大腦發育議題）", "🤯 （聽信未經證實的民間偏方或遠端診斷，往往耗費心機又無效果）", "🔬 （大腦神經發展與精神醫學有其嚴謹的生物學與醫學基礎）", "🩺 （必須回歸實體精神科醫療評估，遵循專業的實證處方）"], "core_title": "【醫療免責與實體診察：拒絕遠端確診與偽科學偏方】", "core_desc": "精神健康與 ADHD 有其嚴謹的醫學與神經生物學基礎。嚴禁透過網路遠端確診或聽信未經證實的偏方。當察覺孩子有嚴重情緒失控、暴力或自傷風險時，務必引導至實體醫療機構進行專業評估。", "articles": [{"title": "醫療免責底線與實體醫療評估引導", "year": "2026年"}]}, {"id": 40, "header": "第四十籤【庚申】", "category": "學習與拖延", "orig": ["平生富貴成吉慶", "麻衣換綠柳隨風", "一向前途通大道", "萬事清吉保平安"], "trans": ["🏆 （培養良好的閱讀與學習習慣，能為孩子一生奠定富貴與吉慶）", "🌿 （告別過去學習被動的舊狀態，展現主動吸收新知的綠意）", "📚 （透過閱讀拓展視野與背景知識，未來的學習道路無比通暢）", "🛡️ （充足的背景知識能降低大腦認知負擔，讓學習過程輕鬆平安）"], "core_title": "【培養閱讀習慣：充實背景知識以降低認知負擔】", "core_desc": "寫作業或學習困難，往往是因為大腦「背景知識不足」。當背景知識匱乏時，學習就像在陌生城市沒有地圖。培養孩子的閱讀習慣能豐富其背景知識，讓前額葉在處理新資訊時大為減壓。", "articles": [{"title": "如何培養孩子的閱讀習慣與長效專注", "year": "2022年"}]}, {"id": 41, "header": "第四十一籤【庚戌】", "category": "家長自我關照", "orig": ["今行到此實難過", "造化由來未經過", "程序的確須當守", "時來運轉得和合"], "trans": ["🌧️ （教養路上走到精疲力竭、感到特別難過與崩潰的時刻）", "🌀 （過去從未面對過如此棘手的神經發展或行為挑戰）", "🩺 （堅持正向的醫療與行為介入程序，一步一腳印進行）", "☀️ （給予自己與孩子時間，渡過難過時刻終會迎來和合）"], "core_title": "【照顧者心理支持：擺脫疲憊與衰竭感】", "core_desc": "陪伴 ADHD 或情緒障礙孩子長大，家長常面臨嚴重的「照顧者疲憊（Burnout）」。當感覺「今行到此實難過」時，請記住這不是您的錯。家長先照顧好自己的身心健康，尋求支持團體與專業醫療程序，才能給孩子穩定的力量。", "articles": [{"title": "過動兒父母完全指導手冊：照顧者心理支持與自我關照", "year": "2020年"}]}, {"id": 42, "header": "第四十二籤【辛丑】", "category": "情緒與對立", "orig": ["一毫反照因緣動", "萬事清吉保平安", "戶內安心寬處坐", "雲開月出照天下"], "trans": ["🔍 （當大人學會自我反照與覺察，親子關係的良性因緣便開始轉動）", "🛡️ （覺察自己的情緒是否被牽動，能保護家庭免於衝突傷害）", "🏡 （在家中建立情緒緩衝空間，讓心平靜下來）", "🌕 （大人情緒穩定後，孩子的心靈也會如月光般重現清晴）"], "core_title": "【情緒自我反照：覺察心跳與情緒牽動】", "core_desc": "情緒管理必須大人先自我練習。當孩子怒了、爸媽也火了時，第一步是「一毫反照」——覺察自己的情緒是否被孩子牽動，提醒自己緊急煞車。透過深呼吸使怒氣降溫，避免兩敗俱傷。", "articles": [{"title": "覺察自己的情緒：提醒自己緊急煞車", "year": "2020年"}]}, {"id": 43, "header": "第四十三籤【辛卯】", "category": "情緒與對立", "orig": ["欲去長江水浪急", "行舟陸上未安全", "寬心且在沙灘坐", "聽得雷聲笑歡顏"], "trans": ["🌊 （面對孩子突如其來的暴怒或心理防衛機轉，切莫急於硬碰硬）", "⚠️ （用指責或說理強推，就像在陸地上行舟般充滿風險與危險）", "☕ （寬心理解孩子暴怒背後的脆弱，給予情緒喘息的沙灘空間）", "🌩️ （風浪與雷聲過後，親子將能重新建立充滿愛的歡笑關係）"], "core_title": "【理解孩子的心理防衛機轉：看見暴怒背後的脆弱】", "core_desc": "孩子展現出對立、嗆聲或「被退學也沒差」的狠話，往往是大腦在面對過大壓力時的「心理防衛機轉」。大人若只看到表面的暴怒而強力壓制，只會惡化對立。寬心看清防衛機轉，才能給予精準支持。", "articles": [{"title": "孩子的心理防禦機轉：理解暴怒背後的脆弱", "year": "2024年"}]}, {"id": 44, "header": "第四十四籤【辛巳】", "category": "學習與拖延", "orig": ["客到前途百事宜", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🤝 （專業職能治療師與醫療團隊客到相助，前途各項發展皆宜）", "🌺 （經過結構化的職能與生活訓練，能力終於結出成果）", "🌕 （家長放寬心配合專業治療規劃，給予持續的正向鼓勵）", "✨ （生活功能與自理能力大增，孩子展現自信與太平）"], "core_title": "【職能治療 (OT) 介入：生活功能與感受性活動設計】", "core_desc": "要讓 ADHD 小朋友願意持續投入，關鍵是活動必須有挑戰性且有趣。職能治療（OT）能幫助孩子進行工作分析，把複雜的家事或學習轉化為多步驟有變化的活動，在成就感中提升注意力。", "articles": [{"title": "ADHD維持投入的秘訣：職能治療觀點", "year": "2019年"}]}, {"id": 45, "header": "第四十五籤【辛未】", "category": "藥物與大腦", "orig": ["花開今已結成實", "君子請當報好音", "木火相生生不息", "福祿勝過舊家風"], "trans": ["🍎 （過去耕耘的行為改變技術，如今已結出正向行為的果實）", "📣 （及時給予讚美與好評價，向孩子與老師傳遞正向好消息）", "🔥 （正向循環生生不息，大腦多巴胺獎勵路徑獲得強有力固化）", "🏡 （良好習慣帶來的成就感，超越過去傳統的管教模式）"], "core_title": "【大腦獎勵路徑：即時正向強化的生生不息】", "core_desc": "大腦的行為改變極度依賴「即時正向強化」。當孩子展現出良好的替代行為時，家長應立即給予具體的讚美與獎勵（木火相生）。這種及時的好消息能活化多巴胺系統，讓正向行為生生不息。", "articles": [{"title": "大腦獎勵路徑與即時回饋強化機制", "year": "2025年"}]}, {"id": 46, "header": "第四十六籤【辛酉】", "category": "自尊與天賦", "orig": ["功名得意在頂尖", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🏆 （不必強求孩子在每個領域都要爭頂尖、跟別人一樣好）", "🌸 （接納孩子發展的自然起伏，專注於自己獨特的成長結果）", "🌕 （大人放寬心擺脫比較心態，欣賞孩子獨一無二的優點）", "🕊️ （放下完美主義的枷鎖，親子共享平靜與成就喜悅）"], "core_title": "【移除「跟別人一樣好」的迷思：給孩子真正的成就感】", "core_desc": "許多家長要求特教或輔導老師全力訓練孩子「跟一般孩子一樣」。然而苦苦追趕的結果，孩子就算趕上了也只是跟別人一樣好，毫無成就感。移除這種迷思，發掘孩子的獨特強項，才能帶來真正的自信。", "articles": [{"title": "移除『跟別人一樣好』的迷思：給孩子真正的成就感", "year": "2022年"}]}, {"id": 47, "header": "第四十七籤【壬子】", "category": "自尊與天賦", "orig": ["君爾何須背後看", "木火相生生不息", "前途光明通大道", "萬事清吉保平安"], "trans": ["🔍 （家長不必總是盯著孩子過去的失敗紀錄或黑歷史不放）", "🌿 （大腦具有強大的神經可塑性，正向的環境能帶來全新的改變）", "🛣️ （向前看、給予適當的輔具與支持，成長之路無比寬廣）", "🛡️ （擺脫過去標籤的陰影，孩子自然能在愛中平安發展）"], "core_title": "【大腦神經可塑性：撕下舊標籤，看向新可能性】", "core_desc": "大腦神經具有可塑性（Neuroplasticity）。過去的注意力不集中或衝動失控，不代表未來的定局。家長切莫「背後看」，老是翻舊帳。用發展的眼光看待孩子，透過正向環境刺激重塑大腦連結。", "articles": [{"title": "大腦神經可塑性：基因與環境的正向互動", "year": "2024年"}]}, {"id": 48, "header": "第四十八籤【壬寅】", "category": "藥物與大腦", "orig": ["陽世不知陰世事", "官法如爐不自由", "用盡心機總未休", "求神問卜枉徒勞"], "trans": ["🧠 （大人常不了解孩子大腦預設模式網絡 (DMN) 活化時的走神狀態）", "⚙️ （大腦神經網路的運作有其生理限制，並非孩子主觀故意作對）", "🤯 （若用大罵或罰站來應對走神，只會讓孩子更加緊張焦慮）", "🩺 （應回歸神經科學理解走神機制，給予明確的視覺提示）"], "core_title": "【理解大腦預設模式網路 (DMN)：發呆與恍神的神經學】", "core_desc": "當孩子上課發呆、寫作業恍神時，是大腦的「預設模式網絡（DMN）」在過度活化，而負責專注的執行網路未能順利切換。大人常誤以為孩子「故意不聽」。理解這層生理機制，改用輕拍或視覺線索喚回注意力。", "articles": [{"title": "大腦預設模式網路 DMN 與走神恍神解析", "year": "2023年"}]}, {"id": 49, "header": "第四十九籤【壬辰】", "category": "學習與拖延", "orig": ["言語雖多不可從", "風雲致雨落洋洋", "命內此事難和合", "更逢一足出外鄉"], "trans": ["🗣️ （大人的指令若講得太多、太複雜，孩子大腦反而無法吸收執行）", "🌧️ （長篇大論的碎念只會引發焦慮雨下，讓孩子選擇關閉耳朵）", "🚫 （過多的指令與批評無法帶來和諧，只會惡化親子對立）", "🎯 （簡化指令為『一次一件、少於10個字』，才能精準執行）"], "core_title": "【簡潔有效的指令法：一次一件、精準明確】", "core_desc": "ADHD 孩子的大腦無法處理多重複雜指令。當大人指令超過特定字數或包含太多要求時，孩子的聽覺工作記憶立刻溢位（言語雖多不可從）。給予指令應：眼對眼、一次只給一個明確步驟、字數簡短。", "articles": [{"title": "大人指令超過幾個字？如何給予簡潔有效指令", "year": "2019年"}]}, {"id": 50, "header": "第五十籤【壬午】", "category": "情緒與對立", "orig": ["佛前發誓無異心", "且看前途得好音", "花開花謝結子成", "郎君即便見太平"], "trans": ["🤝 （父母與教養者之間應達成共識，保持教養標準的一致性）", "📣 （一致的規則與態度，能讓孩子感到安全並傳來行為好消息）", "🌸 （堅持原則並溫和執行，孩子良好的自控力終將結成果實）", "🕊️ （家庭免於教養分歧的爭吵，重新恢復平靜與安寧）"], "core_title": "【教養一致性 (Consistency)：建立明確的家庭結構】", "core_desc": "若父母或祖父母教養標準不一（黑臉白臉角力），孩子會感到混亂，甚至學會在漏洞中操弄。教養者之間應「無異心」，討論出共同的底線與獎懲規則，給予孩子一致且可預期的家庭結構。", "articles": [{"title": "父母教養一致性與跨代溝通", "year": "2020年"}]}, {"id": 51, "header": "第五十一籤【壬申】", "category": "自尊與天賦", "orig": ["東西南北不堪行", "前途此事正茫茫", "銅盆潑水難收回", "勸君且在戶內坐"], "trans": ["🧭 （當孩子在傳統學業賽道四處碰壁、感到迷惘找不到方向時）", "🌫️ （硬逼孩子走不適合的天賦路徑，只會讓未來更加茫然）", "💧 （過度強迫造成的心理傷害與對立，往往難以輕易收回）", "🏡 （不如停下腳步回到家庭避風港，重新評估適性發揮的賽道）"], "core_title": "【適性生涯規劃：尋找發揮優勢特質的賽道】", "core_desc": "抽得此籤表示目前的方向不適合強求。ADHD 或神經多元孩子（Neurodivergent）有其獨特的能力組合。當傳統學業賽道堪難行時，家長應協助孩子進行適性探索，發掘其高創造力、高行動力等特質，尋找能讓孩子發光發亮的專長領域。", "articles": [{"title": "ADHD 的生涯規劃與適性選擇：發掘優勢天賦", "year": "2023年"}]}, {"id": 52, "header": "第五十二籤【壬戌】", "category": "自尊與天賦", "orig": ["功名事業本由天", "心高必然誤君期", "不然且回依舊路", "雲開月出自分明"], "trans": ["🧬 （每個孩子的天賦智力組合與發展節奏，各有其自然規律）", "⚠️ （若大人一味好高騖遠、強求孩子爬樹，反而會耽誤適性發展）", "🐟 （尊重孩子作為『會游泳的魚』的天性，回歸適性培育）", "🌕 （在適合的領域深耕，孩子自然能展現璀璨的天賦與成就）"], "core_title": "【不要用爬樹能力評估一條魚：尊重多元智力】", "core_desc": "愛因斯坦曾說：「每個人都是天才，但如果你用爬樹的能力來評估一條魚，它一生都會相信自己是個傻瓜。」依據多元智力理論，家長應尊重孩子的基因與智力組合，給予屬於他的大海，而非硬逼他去爬樹。", "articles": [{"title": "尊重多元智力特質，給予發光舞台", "year": "2022年"}]}, {"id": 53, "header": "第五十三籤【癸丑】", "category": "同儕與霸凌", "orig": ["看君來意觀雙眉", "七分猜測三分依", "勸君作事可宜先", "和合清吉萬事成"], "trans": ["👁️ （觀察孩子的眼神、微表情與肢體語言，讀懂內心真實感受）", "🧩 （理解自閉症光譜 (ASD) 孩子在解讀社交表情與心智理論上的困難）", "🤝 （預先教導社交情境劇本與規則，提供明確的行為線索）", "✨ （透過結構化社交訓練，孩子終能學會合宜的同儕互動）"], "core_title": "【自閉症光譜 (ASD) 的心智理論 (Theory of Mind) 與社交劇本】", "core_desc": "ASD 孩子往往難以自動「觀雙眉」讀取別人的意圖與非語言情緒（心智理論困難）。家長與老師不應怪罪孩子「沒眼色」，而要預先（作事宜先）提供明確的社交規則說明與情境劇本練習，協助孩子建立社交架構。", "articles": [{"title": "自閉症光譜 ASD 的心智理論與人際情境讀取", "year": "2022年"}]}, {"id": 54, "header": "第五十四籤【癸卯】", "category": "同儕與霸凌", "orig": ["孤燈寂寂夜沉沉", "萬事清吉保平安", "戶內安心寬處坐", "雲開月出照天下"], "trans": ["🕯️ （孩子在學校面臨社交孤立與關係排擠時，內心孤單沉重）", "🛡️ （家庭要成為最溫暖的港灣，保護孩子不受孤立創傷傷害）", "🏡 （在家中建立無條件接納的氛圍，讓孩子能安心傾訴受到的委屈）", "🌟 （家長擔任社交名聲經紀人站台，引導正向同儕關係重現光明）"], "core_title": "【打破 ADHD 女孩的「關係攻擊」與社交孤立】", "core_desc": "ADHD 女孩常面臨隱晦的「關係攻擊（Relational Aggression）」，如小團體排擠、蜚語。由於女孩社交圈封閉且重視忠誠，一旦孤燈寂寂被排擠，極難獨自化解。家長需扮演「名聲經紀人」，主動進行策略性 Playdate 配對，協助打破偏見。", "articles": [{"title": "ADHD 女孩的關係攻擊與同儕排擠處方", "year": "2025年"}]}, {"id": 55, "header": "第五十五籤【癸巳】", "category": "家長自我關照", "orig": ["富貴由命天註定", "心高必然誤君期", "不然且回依舊路", "雲開月出自分明"], "trans": ["🌸 （接納孩子的發育時序與神經特質，放下過度焦慮的強求）", "⚠️ （若大人盲目追逐完美或過度給壓，反而會惡化孩子的焦慮症狀）", "🧘 （回歸減法教養，給予大腦足夠的喘息與空白時間）", "🌕 （壓力減輕後，孩子大腦的自我修復與學習效能自然顯現）"], "core_title": "【減法教養：給大腦留白與喘息時間】", "core_desc": "現代孩子常被填滿各種行程與期待（心高誤君期）。然而大腦需要「留白時間」來進行資訊消化與情感整合。實行減法教養，刪除不必要的過度要求，讓孩子大腦獲得喘息，學習效能反而顯著提升。", "articles": [{"title": "減法教養：給大腦留白與喘息空間", "year": "2024年"}]}, {"id": 56, "header": "第五十六籤【癸未】", "category": "藥物與大腦", "orig": ["事到頭來總要理", "風雲致雨落洋洋", "命內此事難和合", "更逢一足出外鄉"], "trans": ["🩺 （面對孩子的精神健康或行為困難，終究需要勇敢面對與積極處理）", "🌧️ （雖然過程中可能經歷猶豫、焦慮與社會污名化的風雨）", "🚫 （若選擇逃避或假裝沒事，問題無法自然和解，只會日益嚴重）", "🏥 （勇敢跨出就醫評估的一步，尋求專業兒青精神科的整合協助）"], "core_title": "【去污名化：勇敢跨出就醫與專業評估的一步】", "core_desc": "許多家長因害怕被貼標籤而拖延就醫（事到頭來總要理）。但 ADHD 或情緒障礙是生理性發展議題，越早尋求專業醫療評估與介入，越能避免後續的學業失敗與對立反抗。去污名化、正確看待醫療，是保護孩子的關鍵。", "articles": [{"title": "ADHD 診斷與就醫去的污名化：正確看待醫療輔助", "year": "2021年"}]}, {"id": 57, "header": "第五十七籤【癸亥】", "category": "情緒與對立", "orig": ["事非經過不知難", "幸有貴人相扶助", "和合清吉萬事成", "郎君即便見太平"], "trans": ["❤️ （親身經歷了陪伴特殊孩子的辛酸與挑戰，才能體會教養之難）", "🤝 （幸好有專業醫療、學校老師與理解你的親友貴人一路相伴）", "🕊️ （衝突過後用心修復，親子關係與家庭生活終能圓滿和合）", "抱 （一個大大的擁抱勝過長篇大論，親子共享平靜與愛的太平）"], "core_title": "【衝突後的關係修復：一個擁抱勝過長篇大論】", "core_desc": "教養這條路「事非經過不知難」。衝突不可避免，但重點在於「修復」。當暴風雨過後，不要急著抓著孩子檢討講道理。有時候給孩子一個大大的擁抱，傳遞無條件的愛，更能瞬間撫平創傷、重建連結。", "articles": [{"title": "衝突後的修復：給彼此一個擁抱勝過長篇大論", "year": "2020年"}]}, {"id": 58, "header": "第五十八籤【辛未/庚申】", "category": "藥物與大腦", "orig": ["舟行風浪漸漸平", "于今得進可安寧", "必有貴人相扶助", "凶事脫出見太平"], "trans": ["⛵ （隨著孩子步入青春期中後期，大腦前額葉逐漸成熟，風浪趨於平緩）", "🧘 （此時適合引導孩子培養自主獨立管理，家庭重新獲得安寧）", "🌟 （善用同儕正向力量與師長貴人，陪伴孩子度過青春期性緊張與探索）", "🌈 （擺脫了兒童期的衝動混亂，孩子順利跨越青春期展現成熟太平）"], "core_title": "【跨越青春期風暴：引導自主獨立與性緊張調適】", "core_desc": "青春期的 ADHD 孩子面臨荷爾蒙改變、性緊張、獨立渴望與前額葉尚未完全成熟的拉扯。風浪漸平之際，家長應逐步釋放控制權，從「指揮官」轉型為「顧問/導師」，陪伴孩子建立自主管理。", "articles": [{"title": "青春期 ADHD 的性緊張、情緒風暴與獨立自主", "year": "2023年"}]}, {"id": 59, "header": "第五十九籤【壬戌/癸亥】", "category": "藥物與大腦", "orig": ["細雨霏霏落洋洋", "天災時氣必有傷", "命內此事難和合", "更逢一足出外鄉"], "trans": ["🌧️ （當孩子表現出持續的低落、缺乏活力、如細雨綿綿般的憂鬱情緒時）", "💔 （需細心鑑別這是 ADHD 帶來的挫折無力，還是合併了憂鬱症狀）", "🩺 （單靠意志力或安慰無法化解生理性的低潮，需要專業鑑別）", "🏥 （尋求兒青精神科進行整合評估，給予精準的心理與藥物支持）"], "core_title": "【共病鑑別：區分 ADHD 伴隨焦慮憂鬱與純粹憂鬱】", "core_desc": "長期的 ADHD 挫折容易共病焦慮與憂鬱症（細雨霏霏）。家長需注意孩子是因「學習功能受損引發的次發性低潮」，還是「原發性情緒障礙」。及早尋求醫師專業鑑別，才能給予正確的治療處方。", "articles": [{"title": "ADHD 共病憂鬱與焦慮的鑑別與治療", "year": "2023年"}]}, {"id": 60, "header": "第六十籤【癸亥】", "category": "自尊與天賦", "orig": ["月出光輝本清吉", "不須進退問前程", "婚姻皆由天註定", "和合清吉萬事成"], "trans": ["🌕 （六十籤圓滿結尾：每個孩子的心靈本質都是圓滿清吉、充滿光輝的）", "🚶 （只要掌握科學教養與愛的原則，不必再為未來的路焦慮迷惘）", "🧬 （接納生命的獨特特質，尊重基因與神經發育的自然定律）", "🕊️ （愛與界線並存、科學陪伴與醫療相輔，家庭必能萬事圓滿順遂）"], "core_title": "【大圓滿結語：建立『愛與界線並存』的家庭防護網】", "core_desc": "六十甲子籤詩至此圓滿。這套衛教手冊的最終目的，是希望陪伴每一位家長：理解大腦發育（月出光輝）、建立溫和堅定的界線（和合清吉），並運用 314 知識庫的醫學實證，陪孩子平安成長。", "articles": [{"title": "從無助到韌性：建立愛與界線並存的家庭防護網", "year": "2026年"}]}];

    let currentPoem = null;
    let currentCategory = 'ALL';

    function init() {
      renderCategoryGrid('ALL');
      renderSearchGrid('');
    }

    function switchMode(mode, evt) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');

      document.getElementById('view-category').style.display = mode === 'category' ? 'block' : 'none';
      document.getElementById('view-draw').style.display = mode === 'draw' ? 'block' : 'none';
      document.getElementById('view-search').style.display = mode === 'search' ? 'block' : 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');
      renderCategoryGrid(cat);
    }

    function renderCategoryGrid(cat) {
      const grid = document.getElementById('category-grid');
      const filtered = cat === 'ALL' ? POEMS_DATA : POEMS_DATA.filter(p => p.category === cat);
      
      grid.innerHTML = filtered.map(p => `
        <div class="poem-card" onclick="openModal(${p.id})">
          <div>
            <div class="card-header">
              <span class="poem-title">${p.header}</span>
              <span class="poem-tag">${p.category}</span>
            </div>
            <div class="poem-preview"><strong>${p.core_title}</strong></div>
            <div style="font-size: 0.85rem; color: #666;">${p.orig[0] || ''}</div>
          </div>
          <div class="card-footer">點擊查看錦囊 →</div>
        </div>
      `).join('');
    }

    function searchPoems() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      renderSearchGrid(query);
    }

    function renderSearchGrid(query) {
      const grid = document.getElementById('search-grid');
      if (!query) {
        grid.innerHTML = POEMS_DATA.slice(0, 12).map(p => `
          <div class="poem-card" onclick="openModal(${p.id})">
            <div>
              <div class="card-header">
                <span class="poem-title">${p.header}</span>
                <span class="poem-tag">${p.category}</span>
              </div>
              <div class="poem-preview"><strong>${p.core_title}</strong></div>
            </div>
            <div class="card-footer">點擊查看錦囊 →</div>
          </div>
        `).join('');
        return;
      }

      const filtered = POEMS_DATA.filter(p => {
        return p.id.toString() === query ||
               p.header.toLowerCase().includes(query) ||
               p.core_title.toLowerCase().includes(query) ||
               p.core_desc.toLowerCase().includes(query) ||
               p.orig.some(l => l.toLowerCase().includes(query)) ||
               p.articles.some(a => a.title.toLowerCase().includes(query));
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">未找到符合條件的籤詩，請嘗試其他關鍵字</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="poem-card" onclick="openModal(${p.id})">
          <div>
            <div class="card-header">
              <span class="poem-title">${p.header}</span>
              <span class="poem-tag">${p.category}</span>
            </div>
            <div class="poem-preview"><strong>${p.core_title}</strong></div>
          </div>
          <div class="card-footer">點擊查看錦囊 →</div>
        </div>
      `).join('');
    }

    function drawPoem() {
      const tube = document.getElementById('tube-icon');
      tube.classList.add('shaking');
      
      setTimeout(() => {
        tube.classList.remove('shaking');
        const randomId = Math.floor(Math.random() * POEMS_DATA.length) + 1;
        openModal(randomId);
      }, 1000);
    }

    function openModal(id) {
      const p = POEMS_DATA.find(x => x.id === id);
      if (!p) return;
      currentPoem = p;

      document.getElementById('m-cat').innerText = p.category;
      document.getElementById('m-header').innerText = p.header;

      // Translations
      const transList = document.getElementById('m-trans');
      transList.innerHTML = p.orig.map((o, idx) => `
        <li class="trans-item">
          <div class="trans-orig">${o}</div>
          <div class="trans-explain">${p.trans[idx] || ''}</div>
        </li>
      `).join('');

      // Core
      document.getElementById('m-core-title').innerText = p.core_title;
      document.getElementById('m-core-desc').innerText = p.core_desc;

      // Articles
      const artBox = document.getElementById('m-articles');
      artBox.innerHTML = p.articles.map(a => `
        <div class="article-box">
          <div class="article-title">📄 《${a.title}》 （${a.year}）</div>
        </div>
      `).join('');

      document.getElementById('modal-overlay').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    }

    function copyPrescription() {
      if (!currentPoem) return;
      const articleLines = currentPoem.articles.map(a => `• 《${a.title}》（${a.year}）`).join('\n');
      const text = `【${currentPoem.header}】 教養心靈錦囊\n核心指引：${currentPoem.core_title}\n說明：${currentPoem.core_desc}\n\n建議延伸閱讀文章：\n` + articleLines;

      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
