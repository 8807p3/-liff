<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六十甲子籤詩 × 314成人ADHD心智健康錦囊網</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1D3557;
      --primary-dark: #112233;
      --accent: #E63946;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #2B2D42;
      --text-muted: #6C757D;
      --border-color: #DEE2E6;
      --shadow: 0 10px 30px rgba(29, 53, 87, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', 'Noto Serif TC', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #112233 0%, #1D3557 100%);
      color: #FFF;
      text-align: center;
      padding: 40px 20px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
      max-width: 650px;
      margin: 0 auto;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .mode-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: #FFF;
      border: 2px solid #CBD5E1;
      color: var(--primary);
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn.active, .mode-btn:hover {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
      box-shadow: 0 6px 15px rgba(29, 53, 87, 0.25);
    }

    .cat-tags {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .tag-btn {
      background: #E2E8F0;
      border: none;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .tag-btn.active {
      background: var(--primary);
      color: #FFF;
    }

    .poem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .poem-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .poem-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15);
      border-color: var(--primary);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .poem-tag {
      background: #E0F2FE;
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .poem-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .poem-preview {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 10px 0;
      line-height: 1.5;
    }

    .card-footer {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-align: right;
    }

    .draw-section {
      text-align: center;
      padding: 50px 20px;
      background: #FFF;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 500px;
      margin: 0 auto;
    }

    .tube-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      display: inline-block;
    }

    .shaking {
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      75% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); }
    }

    .draw-btn {
      background: linear-gradient(135deg, #1D3557, #112233);
      color: #FFF;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 53, 87, 0.3);
      transition: 0.3s;
    }

    .draw-btn:hover {
      transform: scale(1.05);
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 30px;
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid #CBD5E1;
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(29, 53, 87, 0.15);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-card {
      background: #FFF;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      border-radius: var(--radius);
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      position: relative;
    }

    .modal-header {
      background: linear-gradient(135deg, #112233, #1D3557);
      color: #FFF;
      padding: 22px 60px 22px 25px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.4);
      color: #FFF;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      z-index: 20;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: scale(1.1);
    }

    .modal-body { padding: 25px 30px 35px; }

    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 6px;
      margin: 20px 0 12px;
    }

    .trans-list { list-style: none; }

    .trans-item {
      background: #F1F5F9;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .trans-orig { font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
    .trans-explain { font-size: 0.95rem; color: #333; }

    .article-box {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 8px;
    }

    .article-title { font-weight: 700; color: #1E40AF; }

    .action-btn-group { display: flex; gap: 12px; margin-top: 25px; }

    .copy-btn {
      flex: 2;
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .copy-btn:hover { background: var(--primary-dark); }

    .bottom-close-btn {
      flex: 1;
      background: #E2E8F0;
      color: var(--text-main);
      border: 1px solid #CBD5E1;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .bottom-close-btn:hover { background: #CBD5E1; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2B2D42;
      color: #FFF;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      z-index: 2000;
    }
  </style>
</head>
<body>

  <header>
    <h1>六十甲子籤詩 × 314成人ADHD心智健康錦囊網</h1>
    <p>專為成人 ADHD 設計的職場執行力、自我接納、親密關係與 314 知識庫實證對照指引</p>
  </header>

  <div class="container">
    <div class="mode-nav">
      <button class="mode-btn active" onclick="switchMode('category', event)">💼 痛點分類探索</button>
      <button class="mode-btn" onclick="switchMode('draw', event)">🔮 誠心求籤／今日處方</button>
      <button class="mode-btn" onclick="switchMode('search', event)">🔍 成人 60 籤目錄搜尋</button>
    </div>

    <div id="view-category">
      <div class="cat-tags">
        <button class="tag-btn active" onclick="filterCategory('ALL', event)">🌟 全部主題</button>
        <button class="tag-btn" onclick="filterCategory('💼 職場與工作執行', event)">💼 職場與工作執行</button>
        <button class="tag-btn" onclick="filterCategory('🧘 自我接納與冒牌者', event)">🧘 自我接納與冒牌者</button>
        <button class="tag-btn" onclick="filterCategory('❤️ 伴侶與親密關係', event)">❤️ 伴侶與親密關係</button>
        <button class="tag-btn" onclick="filterCategory('⚡ 情緒調控與 RSD', event)">⚡ 情緒調控與 RSD</button>
        <button class="tag-btn" onclick="filterCategory('🏡 生活管理與睡眠', event)">🏡 生活管理與睡眠</button>
        <button class="tag-btn" onclick="filterCategory('🩺 成人就醫與藥物', event)">🩺 成人就醫與藥物</button>
      </div>
      <div class="poem-grid" id="category-grid"></div>
    </div>

    <div id="view-draw" style="display: none;">
      <div class="draw-section">
        <div class="tube-icon" id="tube-icon">🎋</div>
        <h2 style="font-family: 'Noto Serif TC'; color: var(--primary); margin-bottom: 12px;">靜心默想當下的職涯或生活挑戰</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">誠心祈求今日的成人 ADHD 心智健康錦囊</p>
        <button class="draw-btn" onclick="drawPoem()">誠心搖籤</button>
      </div>
    </div>

    <div id="view-search" style="display: none;">
      <div class="search-box">
        <input type="text" class="search-input" id="search-input" placeholder="輸入籤號（如 1）或關鍵字（如 職場, 拖延, 冒牌者, 睡眠）..." oninput="searchPoems()">
      </div>
      <div class="poem-grid" id="search-grid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <button class="close-btn" onclick="closeModal()" title="關閉視窗">✕</button>
        <div style="font-size: 0.85rem; opacity: 0.85; margin-bottom: 4px;" id="m-cat">分類</div>
        <h2 style="font-family: 'Noto Serif TC'; font-size: 1.6rem;" id="m-header">籤號與干支</h2>
      </div>
      <div class="modal-body">
        <div class="section-title">📜 籤詩原文與成人 ADHD 白話對譯</div>
        <ul class="trans-list" id="m-trans"></ul>

        <div class="section-title">💡 核心指引與神經多樣性解析</div>
        <h4 style="color: var(--primary); margin-bottom: 8px;" id="m-core-title">核心標題</h4>
        <p style="font-size: 0.95rem; color: #444; margin-bottom: 15px;" id="m-core-desc">描述內容</p>

        <div class="section-title">📚 建議延伸閱讀（314 資料庫真實原創文章）</div>
        <div id="m-articles"></div>

        <div class="action-btn-group">
          <button class="copy-btn" onclick="copyPrescription()">📋 複製成人處方</button>
          <button class="bottom-close-btn" onclick="closeModal()">關閉錦囊</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已成功複製成人 ADHD 處方至剪貼簿！</div>

HD 的超專注與創造力特質，大展身手）", "⛵ （勸君且守待運通 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "大器晚成與耐心等待：成人 ADHD 的刻意練習與蓄力", "core_desc": "抽得此籤表示目前做事總不如意，但這不是因為孩子不努力，而是發育時機未到。最重要的事是「發掘並充實孩子的強處」。只要具備優勢能力，絕不會被埋沒。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "ADHD 孩子的學習策略：設定目標，分解任務，刻意練習", "year": "2019年"}]}, {"id": 16, "header": "第十六籤【丙子】", "category": "🩺 成人就醫與藥物", "orig": ["不須作福不須求", "用盡心機總未休", "陽世不知陰世事", "官法如爐不自由"], "trans": ["🌅 （不須作福不須求 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （用盡心機總未休 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （陽世不知陰世事 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （官法如爐不自由 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "睡眠衛生與大腦膠狀淋巴系統：修復夜間腦力疲勞", "core_desc": "許多注意力不集中與情緒易怒，根本原因在於「睡眠債務」與生理時鐘失調。大腦在睡眠時會清除代謝廢物並進行突觸修剪。若忽視睡眠品質與警醒系統（Arousal System）的規律，任何學習訓練都事倍功半。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "揭開孩子入睡之謎：生理時鐘、警醒系統、睡眠債務你知多少？", "year": "2021年"}]}, {"id": 17, "header": "第十七籤【丙寅】", "category": "🧘 自我接納與冒牌者", "orig": ["舊恨重重未改為", "家中禍患不臨身", "須當謹防宜作福", "龍蛇交會得和合"], "trans": ["🌅 （舊恨重重未改為 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （家中禍患不臨身 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （須當謹防宜作福 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （龍蛇交會得和合 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "療癒過往學習創傷：重建內在安全感與心理防禦", "core_desc": "長期的失敗經驗會在大腦留下創傷記號。即使經歷無數次辛酸，也不必耿耿於懷。家長要振作起來，保持心地善良與非批判式的接納，多給予正面肯定，帶領孩子化險為夷。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "長期嚴重精神創傷會不會導致注意力不集中，易怒？", "year": "2024年"}]}, {"id": 18, "header": "第十八籤【丙辰】", "category": "🤝 同儕與社交人際", "orig": ["君問中間此言因", "看看祿馬拱前程", "若得貴人多得利", "和合自有兩分明"], "trans": ["🌅 （君問中間此言因 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （看看祿馬拱前程 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （若得貴人多得利 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （和合自有兩分明 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "職場正向回饋：4:1 讚美法則與同儕肯定機制", "core_desc": "孩子心田善良，善心自會有善報。在進行行為矯正時，家長應運用「正向行為支持（PBS）」。在朋友與同儕面前，維持「4 個讚美：1 個修正」的黃金比例，幫孩子做面子，引導貴人相助。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "家長友誼教練（PFC）與 4:1 讚美修正法則", "year": "2025年"}]}, {"id": 19, "header": "第十九籤【丙午】", "category": "💼 職場與工作執行", "orig": ["富貴由命天註定", "心高必然誤 ], "core_title": "同理心與傾聽：修復職場與家庭人際張力", "core_desc": "習慣是在「提示、常規、獎勵」三要素中不斷增強的。拖延是一種壞習慣，因為它能立即緩解寫作業的焦慮。要建立好習慣，家長需重新設計提示（如放置書包點），簡化常規，並在完成時給予立即的正向獎勵。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "習慣的力量：提示、常規與獎勵迴路", "year": "2019年"}]}, {"id": 38, "header": "第三十八籤【庚辰】", "category": "❤️ 伴侶與親密關係", "orig": ["名顯意揚幸運逢", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🌅 （名顯意揚幸運逢 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （花開花謝結子成 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （寬心且看月中桂 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （郎君即便見太平 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "建立實體醫療與心理諮商支持底線：拒絕無效內耗", "core_desc": "面對受挫或拒學的孩子，家長常犯的錯誤是急著給建議或講道理（表面同情）。正確做法是運用「真誠同理」——不帶批判地接住孩子的「社會痛（Social Pain）」，將「不良行為」與「孩子的自我價值」分開，給予安全感。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "真誠同理 vs 表面同情：接住孩子的社會痛", "year": "2025年"}]}, {"id": 39, "header": "第三十九籤【庚午】", "category": "🤝 同儕與社交人際", "orig": ["意中若問神仙事", "用盡心機總未休", "陽世不知陰世事", "官法如爐不自由"], "trans": ["🌅 （意中若問神仙事 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （用盡心機總未休 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （陽世不知陰世事 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （官法如爐不自由 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "閱讀與背景知識積累：降低成人認知負荷與學習焦慮", "core_desc": "精神健康與 ADHD 有其嚴謹的醫學與神經生物學基礎。嚴禁透過網路遠端確診或聽信未經證實的偏方。當察覺孩子有嚴重情緒失控、暴力或自傷風險時，務必引導至實體醫療機構進行專業評估。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "醫療免責底線與實體醫療評估引導", "year": "2026年"}]}, {"id": 40, "header": "第四十籤【庚申】", "category": "💼 職場與工作執行", "orig": ["平生富貴成吉慶", "麻衣換綠柳隨風", "一向前途通大道", "萬事清吉保平安"], "trans": ["🌅 （平生富貴成吉慶 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （麻衣換綠柳隨風 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （一向前途通大道 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （萬事清吉保平安 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "照顧者心理衰竭處方：家長與成人自身的自我關照", "core_desc": "寫作業或學習困難，往往是因為大腦「背景知識不足」。當背景知識匱乏時，學習就像在陌生城市沒有地圖。培養孩子的閱讀習慣能豐富其背景知識，讓前額葉在處理新資訊時大為減壓。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "如何培養孩子的閱讀習慣與長效專注", "year": "2022年"}]}, {"id": 41, "header": "第四十一籤【庚戌】", "category": "🧘 自我接納與冒牌者", "orig": ["今行到此實難過", "造化由來未經過", "程序的確須當守", "時來運轉得和合"], "trans": ["🌅 （今行到此實難過 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （造化由來未經過 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （程序的確須當守 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （時來運轉得和合 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "情緒自我反照：覺察生理緊繃與緊急煞車機制", "core_desc": "陪伴 ADHD 或情緒障礙孩子長大，家長常面臨嚴重的「照顧者疲憊（Burnout）」。當感覺「今行到此實難過」時，請記住這不是您的錯。家長先照顧好自己的身心健康，尋求支持團體與專業醫療程序，才能給孩子穩定的力量。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "過動兒父母完全指導手冊：照顧者心理支持與自我關照", "year": "2020年"}]}, {"id": 42, "header": "第四十二籤【辛丑】", "category": "⚡ 情緒調控與 RSD", "orig": ["一毫反照因緣動", "萬事清吉保平安", "戶內安心寬處坐", "雲開月出照天下"], "trans": ["🌅 （一毫反照因緣動 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （萬事清吉保平安 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （戶內安心寬處坐 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （雲開月出照天下 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "透視心智防衛機轉：看見情緒暴怒背後的脆弱", "core_desc": "情緒管理必須大人先自我練習。當孩子怒了、爸媽也火了時，第一步是「一毫反照」——覺察自己的情緒是否被孩子牽動，提醒自己緊急煞車。透過深呼吸使怒氣降溫，避免兩敗俱傷。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "覺察自己的情緒：提醒自己緊急煞車", "year": "2020年"}]}, {"id": 43, "header": "第四十三籤【辛卯】", "category": "⚡ 情緒調控與 RSD", "orig": ["欲去長江水浪急", "行舟陸上未安全", "寬心且在沙灘坐", "聽得雷聲笑歡顏"], "trans": ["🌅 （欲去長江水浪急 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （行舟陸上未安全 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （寬心且在沙灘坐 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （聽得雷聲笑歡顏 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "職能治療觀點：多步驟職場任務分析與有趣化設計", "core_desc": "孩子展現出對立、嗆聲或「被退學也沒差」的狠話，往往是大腦在面對過大壓力時的「心理防衛機轉」。大人若只看到表面的暴怒而強力壓制，只會惡化對立。寬心看清防衛機轉，才能給予精準支持。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "孩子的心理防禦機轉：理解暴怒背後的脆弱", "year": "2024年"}]}, {"id": 44, "header": "第四十四籤【辛巳】", "category": "💼 職場與工作執行", "orig": ["客到前途百事宜", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🌅 （客到前途百事宜 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （花開花謝結子成 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （寬心且看月中桂 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （郎君即便見太平 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "大腦獎勵路徑：即時正向強化的生生不息", "core_desc": "要讓 ADHD 小朋友願意持續投入，關鍵是活動必須有挑戰性且有趣。職能治療（OT）能幫助孩子進行工作分析，把複雜的家事或學習轉化為多步驟有變化的活動，在成就感中提升注意力。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "ADHD維持投入的秘訣：職能治療觀點", "year": "2019年"}]}, {"id": 45, "header": "第四十五籤【辛未】", "category": "💼 職場與工作執行", "orig": ["花開今已結成實", "君子請當報好音", "木火相生生不息", "福祿勝過舊家風"], "trans": ["🌅 （花開今已結成實 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （君子請當報好音 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （木火相生生不息 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （福祿勝過舊家風 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "移除『跟別人一樣好』的迷思：給自己真正的成就感", "core_desc": "大腦的行為改變極度依賴「即時正向強化」。當孩子展現出良好的替代行為時，家長應立即給予具體的讚美與獎勵（木火相生）。這種及時的好消息能活化多巴胺系統，讓正向行為生生不息。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "大腦獎勵路徑與即時回饋強化機制", "year": "2025年"}]}, {"id": 46, "header": "第四十六籤【辛酉】", "category": "🧘 自我接納與冒牌者", "orig": ["功名得意在頂尖", "花開花謝結子成", "寬心且看月中桂", "郎君即便見太平"], "trans": ["🌅 （功名得意在頂尖 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （花開花謝結子成 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （寬心且看月中桂 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （郎君即便見太平 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "神經可塑性：撕下過去舊標籤，走向未來新可能性", "core_desc": "許多家長要求特教或輔導老師全力訓練孩子「跟一般孩子一樣」。然而苦苦追趕的結果，孩子就算趕上了也只是跟別人一樣好，毫無成就感。移除這種迷思，發掘孩子的獨特強項，才能帶來真正的自信。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "移除『跟別人一樣好』的迷思：給孩子真正的成就感", "year": "2022年"}]}, {"id": 47, "header": "第四十七籤【壬子】", "category": "🧘 自我接納與冒牌者", "orig": ["君爾何須背後看", "木火相生生不息", "前途光明通大道", "萬事清吉保平安"], "trans": ["🌅 （君爾何須背後看 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （木火相生生不息 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （前途光明通大道 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （萬事清吉保平安 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "理解大腦預設模式網路 (DMN)：走神與恍神的神經學解析", "core_desc": "大腦神經具有可塑性（Neuroplasticity）。過去的注意力不集中或衝動失控，不代表未來的定局。家長切莫「背後看」，老是翻舊帳。用發展的眼光看待孩子，透過正向環境刺激重塑大腦連結。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "大腦神經可塑性：基因與環境的正向互動", "year": "2024年"}]}, {"id": 48, "header": "第四十八籤【壬寅】", "category": "🧠 預設模式網路DMN", "orig": ["陽世不知陰世事", "官法如爐不自由", "用盡心機總未休", "求神問卜枉徒勞"], "trans": ["🌅 （陽世不知陰世事 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （官法如爐不自由 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （用盡心機總未休 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （求神問卜枉徒勞 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "簡潔有效的指令與溝通：一次一件、精準明確", "core_desc": "當孩子上課發呆、寫作業恍神時，是大腦的「預設模式網絡（DMN）」在過度活化，而負責專注的執行網路未能順利切換。大人常誤以為孩子「故意不聽」。理解這層生理機制，改用輕拍或視覺線索喚回注意力。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "大腦預設模式網路 DMN 與走神恍神解析", "year": "2023年"}]}, {"id": 49, "header": "第四十九籤【壬辰】", "category": "💼 職場與工作執行", "orig": ["言語雖多不可從", "風雲致雨落洋洋", "命內此事難和合", "更逢一足出外鄉"], "trans": ["🌅 （言語雖多不可從 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （風雲致雨落洋洋 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （命內此事難和合 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （更逢一足出外鄉 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "教養與生活一致性：建立可預期的家庭與工作結構", "core_desc": "ADHD 孩子的大腦無法處理多重複雜指令。當大人指令超過特定字數或包含太多要求時，孩子的聽覺工作記憶立刻溢位（言語雖多不可從）。給予指令應：眼對眼、一次只給一個明確步驟、字數簡短。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "大人指令超過幾個字？如何給予簡潔有效指令", "year": "2019年"}]}, {"id": 50, "header": "第五十籤【壬午】", "category": "❤️ 伴侶與親密關係", "orig": ["佛前發誓無異心", "且看前途得好音", "花開花謝結子成", "郎君即便見太平"], "trans": ["🌅 （佛前發誓無異心 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （且看前途得好音 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （花開花謝結子成 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （郎君即便見太平 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "適性生涯規劃：發掘優勢特質與適宜賽道", "core_desc": "若父母或祖父母教養標準不一（黑臉白臉角力），孩子會感到混亂，甚至學會在漏洞中操弄。教養者之間應「無異心」，討論出共同的底線與獎懲規則，給予孩子一致且可預期的家庭結構。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "父母教養一致性與跨代溝通", "year": "2020年"}]}, {"id": 51, "header": "第五十一籤【壬申】", "category": "💼 職場與工作執行", "orig": ["東西南北不堪行", "前途此事正茫茫", "銅盆潑水難收回", "勸君且在戶內坐"], "trans": ["🌅 （東西南北不堪行 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （前途此事正茫茫 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （銅盆潑水難收回 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （勸君且在戶內坐 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "尊重多元智力特質：不要用爬樹能力評估一條魚", "core_desc": "抽得此籤表示目前的方向不適合強求。ADHD 或神經多元孩子（Neurodivergent）有其獨特的能力組合。當傳統學業賽道堪難行時，家長應協助孩子進行適性探索，發掘其高創造力、高行動力等特質，尋找能讓孩子發光發亮的專長領域。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "ADHD 的生涯規劃與適性選擇：發掘優勢天賦", "year": "2023年"}]}, {"id": 52, "header": "第五十二籤【壬戌】", "category": "🧘 自我接納與冒牌者", "orig": ["功名事業本由天", "心高必然誤君期", "不然且回依舊路", "雲開月出自分明"], "trans": ["🌅 （功名事業本由天 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （心高必然誤君期 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （不然且回依舊路 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （雲開月出自分明 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "自閉光譜 (ASD) 與成人心智理論：社交情境讀取與劇本", "core_desc": "愛因斯坦曾說：「每個人都是天才，但如果你用爬樹的能力來評估一條魚，它一生都會相信自己是個傻瓜。」依據多元智力理論，家長應尊重孩子的基因與智力組合，給予屬於他的大海，而非硬逼他去爬樹。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "尊重多元智力特質，給予發光舞台", "year": "2022年"}]}, {"id": 53, "header": "第五十三籤【癸丑】", "category": "🤝 同儕與社交人際", "orig": ["看君來意觀雙眉", "七分猜測三分依", "勸君作事可宜先", "和合清吉萬事成"], "trans": ["🌅 （看君來意觀雙眉 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （七分猜測三分依 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （勸君作事可宜先 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （和合清吉萬事成 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "打破女性 ADHD 的關係排擠與社交孤立處方", "core_desc": "ASD 孩子往往難以自動「觀雙眉」讀取別人的意圖與非語言情緒（心智理論困難）。家長與老師不應怪罪孩子「沒眼色」，而要預先（作事宜先）提供明確的社交規則說明與情境劇本練習，協助孩子建立社交架構。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "自閉症光譜 ASD 的心智理論與人際情境讀取", "year": "2022年"}]}, {"id": 54, "header": "第五十四籤【癸卯】", "category": "🤝 同儕與社交人際", "orig": ["孤燈寂寂夜沉沉", "萬事清吉保平安", "戶內安心寬處坐", "雲開月出照天下"], "trans": ["🌅 （孤燈寂寂夜沉沉 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （萬事清吉保平安 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （戶內安心寬處坐 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （雲開月出照天下 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "減法生活：給大腦留白與喘息空間", "core_desc": "ADHD 女孩常面臨隱晦的「關係攻擊（Relational Aggression）」，如小團體排擠、蜚語。由於女孩社交圈封閉且重視忠誠，一旦孤燈寂寂被排擠，極難獨自化解。家長需扮演「名聲經紀人」，主動進行策略性 Playdate 配對，協助打破偏見。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "ADHD 女孩的關係攻擊與同儕排擠處方", "year": "2025年"}]}, {"id": 55, "header": "第五十五籤【癸巳】", "category": "🏡 生活管理與睡眠", "orig": ["富貴由命天註定", "心高必然誤君期", "不然且回依舊路", "雲開月出自分明"], "trans": ["🌅 （富貴由命天註定 ➔ 點亮大腦專注高光時刻，讓職涯與生活的困頓逐漸散去）", "⚡ （心高必然誤君期 ➔ 擺脫拖延與執行功能障礙，邁向自信與成功）", "🎯 （不然且回依舊路 ➔ 善用成人 ADHD 的超專注與創造力特質，大展身手）", "⛵ （雲開月出自分明 ➔ 順應神經多樣性天性前行，終將獲得圓滿成果）"], "core_title": "去污名化：勇敢跨出成人醫療評估與專業求助的一步", "core_desc": "現代孩子常被填滿各種行程與期待（心高誤君期）。然而大腦需要「留白時間」來進行資訊消化與情感整合。實行減法教養，刪除不必要的過度要求，讓孩子大腦獲得喘息，學習效能反而顯著提升。（本篇延伸引用自 314 實證知識庫，提供最堅實的神經醫學與心理調適依據）。", "articles": [{"title": "減法教養：給大腦留白與喘息空間", "year": "2024年"}]}, {"id": 56, "header": "第五十六籤【癸未】", "category": "🩺 成人就醫與藥物", "orig": [     let currentPoem = null;
    let currentCategory = 'ALL';

    function init() {
      renderCategoryGrid('ALL');
      renderSearchGrid('');
    }

    function switchMode(mode, evt) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');

      document.getElementById('view-category').style.display = mode === 'category' ? 'block' : 'none';
      document.getElementById('view-draw').style.display = mode === 'draw' ? 'block' : 'none';
      document.getElementById('view-search').style.display = mode === 'search' ? 'block' : 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');
      renderCategoryGrid(cat);
    }

    function renderCategoryGrid(cat) {
      const grid = document.getElementById('category-grid');
      const filtered = cat === 'ALL' ? POEMS_DATA : POEMS_DATA.filter(p => p.category === cat);
      
      grid.innerHTML = filtered.map(p => `
        <div class="poem-card" onclick="openModal(${p.id})">
          <div>
            <div class="card-header">
              <span class="poem-title">${p.header}</span>
              <span class="poem-tag">${p.category}</span>
            </div>
            <div class="poem-preview"><strong>${p.core_title}</strong></div>
            <div style="font-size: 0.85rem; color: #666;">${p.orig[0] || ''}</div>
          </div>
          <div class="card-footer">點擊查看錦囊 →</div>
        </div>
      `).join('');
    }

    function searchPoems() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      renderSearchGrid(query);
    }

      const grid = document.getElementById('search-grid');
      if (!query) {
        grid.innerHTML = POEMS_DATA.slice(0, 12).map(p => `
          <div class="poem-card" onclick="openModal(${p.id})">
            <div>
              <div class="card-header">
                <span class="poem-title">${p.header}</span>
                <span class="poem-tag">${p.category}</span>
              </div>
              <div class="poem-preview"><strong>${p.core_title}</strong></div>
            </div>
            <div class="card-footer">點擊查看錦囊 →</div>
          </div>
        `).join('');
        return;
      }

      const filtered = POEMS_DATA.filter(p => {
        return p.id.toString() === query ||
               p.header.toLowerCase().includes(query) ||
               p.core_title.toLowerCase().includes(query) ||
               p.core_desc.toLowerCase().includes(query) ||
               p.orig.some(l => l.toLowerCase().includes(query)) ||
               p.articles.some(a => a.title.toLowerCase().includes(query));
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">未找到符合條件的成人籤詩，請嘗試其他關鍵字</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="poem-card" onclick="openModal(${p.id})">
          <div>
            <div class="card-header">
              <span class="poem-title">${p.header}</span>
              <span class="poem-tag">${p.category}</span>
            </div>
            <div class="poem-preview"><strong>${p.core_title}</strong></div>
          </div>
          <div class="card-footer">點擊查看錦囊 →</div>
        </div>
      `).join('');
    }

    function drawPoem() {
      const tube = document.getElementById('tube-icon');
      tube.classList.add('shaking');
      
      setTimeout(() => {
        tube.classList.remove('shaking');
        const randomId = Math.floor(Math.random() * POEMS_DATA.length) + 1;
        openModal(randomId);
      }, 1000);
    }

    function openModal(id) {
      const p = POEMS_DATA.find(x => x.id === id);
      if (!p) return;
      currentPoem = p;

      document.getElementById('m-cat').innerText = p.category;
      document.getElementById('m-header').innerText = p.header;

      const transList = document.getElementById('m-trans');
      transList.innerHTML = p.orig.map((o, idx) => `
        <li class="trans-item">
          <div class="trans-orig">${o}</div>
          <div class="trans-explain">${p.trans[idx] || ''}</div>
        </li>
      `).join('');

      document.getElementById('m-core-title').innerText = p.core_title;
      document.getElementById('m-core-desc').innerText = p.core_desc;

      const artBox = document.getElementById('m-articles');
      artBox.innerHTML = p.articles.map(a => `
        <div class="article-box">
          <div class="article-title">📄 《${a.title}》 （${a.year}）</div>
        </div>
      `).join('');

      document.getElementById('modal-overlay').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    }

    function copyPrescription() {
      if (!currentPoem) return;
      const articleLines = currentPoem.articles.map(a => `• 《${a.title}》（${a.year}）`).join('\n');
      const text = `【${currentPoem.header}】 成人 ADHD 心智錦囊\n核心指引：${currentPoem.core_title}\n說明：${currentPoem.core_desc}\n\n建議延伸閱讀文章：\n` + articleLines;

      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
