<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六十甲子籤詩 × 314成人ADHD心智健康錦囊網</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1D3557;
      --primary-dark: #112233;
      --accent: #E63946;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #2B2D42;
      --text-muted: #6C757D;
      --border-color: #DEE2E6;
      --shadow: 0 10px 30px rgba(29, 53, 87, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Serif TC', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #112233 0%, #1D3557 100%);
      color: #FFF;
      text-align: center;
      padding: 40px 20px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
      max-width: 650px;
      margin: 0 auto;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .mode-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: #FFF;
      border: 2px solid #CBD5E1;
      color: var(--primary);
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn.active, .mode-btn:hover {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
      box-shadow: 0 6px 15px rgba(29, 53, 87, 0.25);
    }

    .cat-tags {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .tag-btn {
      background: #E2E8F0;
      border: none;
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .tag-btn.active {
      background: var(--primary);
      color: #FFF;
    }

    .poem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .poem-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .poem-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15);
      border-color: var(--primary);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .poem-tag {
      background: #E0F2FE;
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .poem-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .poem-preview {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 10px 0;
      line-height: 1.5;
    }

    .card-footer {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-align: right;
    }

    .draw-section {
      text-align: center;
      padding: 50px 20px;
      background: #FFF;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 500px;
      margin: 0 auto;
    }

    .tube-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      display: inline-block;
    }

    .shaking {
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      75% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); }
    }

    .draw-btn {
      background: linear-gradient(135deg, #1D3557, #112233);
      color: #FFF;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 53, 87, 0.3);
      transition: 0.3s;
    }

    .draw-btn:hover {
      transform: scale(1.05);
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 30px;
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid #CBD5E1;
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(29, 53, 87, 0.15);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-card {
      background: #FFF;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      border-radius: var(--radius);
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      position: relative;
    }

    .modal-header {
      background: linear-gradient(135deg, #112233, #1D3557);
      color: #FFF;
      padding: 22px 60px 22px 25px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.4);
      color: #FFF;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      z-index: 20;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: scale(1.1);
    }

    .modal-body {
      padding: 25px 30px 35px;
    }

    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 6px;
      margin: 20px 0 12px;
    }

    .trans-list {
      list-style: none;
    }

    .trans-item {
      background: #F1F5F9;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .trans-orig {
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .trans-explain {
      font-size: 0.95rem;
      color: #333;
    }

    .article-box {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 8px;
    }

    .article-title {
      font-weight: 700;
      color: #1E40AF;
    }

    .action-btn-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .copy-btn {
      flex: 2;
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .copy-btn:hover {
      background: var(--primary-dark);
    }

    .bottom-close-btn {
      flex: 1;
      background: #E2E8F0;
      color: var(--text-main);
      border: 1px solid #CBD5E1;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .bottom-close-btn:hover {
      background: #CBD5E1;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2B2D42;
      color: #FFF;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      z-index: 2000;
    }
  </style>
</head>
<body>

  <header>
    <h1>六十甲子籤詩 × 314成人ADHD心智健康錦囊網</h1>
    <p>專為成人 ADHD 設計的職涯執行力、自我接納、親密關係與神經多樣性生活指引</p>
  </header>

  <div class="container">
    <div class="mode-nav">
      <button class="mode-btn active" onclick="switchMode('category', event)">💼 痛點分類探索</button>
      <button class="mode-btn" onclick="switchMode('draw', event)">🔮 誠心求籤／今日處方</button>
      <button class="mode-btn" onclick="switchMode('search', event)">🔍 成人 60 籤目錄搜尋</button>
    </div>

    <div id="view-category">
      <div class="cat-tags">
        <button class="tag-btn active" onclick="filterCategory('ALL', event)">🌟 全部主題</button>
        <button class="tag-btn" onclick="filterCategory('💼 職場與工作執行', event)">💼 職場與工作執行</button>
        <button class="tag-btn" onclick="filterCategory('🧘 自我接納與冒牌者', event)">🧘 自我接納與冒牌者</button>
        <button class="tag-btn" onclick="filterCategory('❤️ 伴侶與親密關係', event)">❤️ 伴侶與親密關係</button>
        <button class="tag-btn" onclick="filterCategory('⚡ 情緒調控與 RSD', event)">⚡ 情緒調控與 RSD</button>
        <button class="tag-btn" onclick="filterCategory('🏡 生活管理與睡眠', event)">🏡 生活管理與睡眠</button>
        <button class="tag-btn" onclick="filterCategory('🩺 成人就醫與藥物', event)">🩺 成人就醫與藥物</button>
      </div>
      <div class="poem-grid" id="category-grid"></div>
    </div>

    <div id="view-draw" style="display: none;">
      <div class="draw-section">
        <div class="tube-icon" id="tube-icon">🎋</div>
        <h2 style="font-family: 'Noto Serif TC'; color: var(--primary); margin-bottom: 12px;">靜心默想當下的職涯或生活挑戰</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">誠心祈求今日的成人 ADHD 心智健康錦囊</p>
        <button class="draw-btn" onclick="drawPoem()">誠心搖籤</button>
      </div>
    </div>

    <div id="view-search" style="display: none;">
      <div class="search-box">
        <input type="text" class="search-input" id="search-input" placeholder="輸入籤號（如 1）或關鍵字（如 職場, 拖延, RSD, 冒牌者, 睡眠）..." oninput="searchPoems()">
      </div>
      <div class="poem-grid" id="search-grid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <button class="close-btn" onclick="closeModal()" title="關閉視窗">✕</button>
        <div style="font-size: 0.85rem; opacity: 0.85; margin-bottom: 4px;" id="m-cat">分類</div>
        <h2 style="font-family: 'Noto Serif TC'; font-size: 1.6rem;" id="m-header">籤號與干支</h2>
      </div>
      <div class="modal-body">
        <div class="section-title">📜 籤詩原文與成人 ADHD 白話對譯</div>
        <ul class="trans-list" id="m-trans"></ul>

        <div class="section-title">💡 核心指引與神經多樣性解析</div>
        <h4 style="color: var(--primary); margin-bottom: 8px;" id="m-core-title">核心標題</h4>
        <p style="font-size: 0.95rem; color: #444; margin-bottom: 15px;" id="m-core-desc">描述內容</p>

        <div class="section-title">📚 建議延伸閱讀（314 成人專題標題與年份）</div>
        <div id="m-articles"></div>

        <div class="action-btn-group">
          <button class="copy-btn" onclick="copyPrescription()">📋 複製成人處方</button>
          <button class="bottom-close-btn" onclick="closeModal()">關閉錦囊</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已成功複製成人 ADHD 處方至剪貼簿！</div>

    let currentPoem = null;
    let currentCategory = 'ALL';

    function init() {
      renderCategoryGrid('ALL');
      renderSearchGrid('');
    }

    function switchMode(mode, evt) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');

      document.getElementById('view-category').style.display = mode === 'category' ? 'block' : 'none';
      document.getElementById('view-draw').style.display = mode === 'draw' ? 'block' : 'none';
      document.getElementById('view-search').style.display = mode === 'search' ? 'block' : 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');
      renderCategoryGrid(cat);
    }

    function renderCategoryGrid(cat) {
      const grid = document.getElementById('category-grid');
      const filtered = cat === 'ALL' ? POEMS_DATA : POEMS_DATA.filter(p => p.category === cat);
      
      grid.innerHTML = filtered.map(p => `
        <div class="poem-card" onclick="openModal(${p.id})">

            </div>

            <div style="font-size: 0.85rem; color: #666;">${p.orig[0] || ''}</div>
          </div>
          <div class="card-footer">點擊查看錦囊 →</div>
        </div>
      `).join('');
    }

    function searchPoems() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      renderSearchGrid(query);
    }

    function renderSearchGrid(query) {
      const grid = document.getElementById('search-grid');
      if (!query) {
        grid.innerHTML = POEMS_DATA.slice(0, 12).map(p => `
          <div class="poem-card" onclick="openModal(${p.id})">
            <div>
              <div class="card-header">
                <span class="poem-title">${p.header}</span>
                <span class="poem-tag">${p.category}</span>
              </div>
              <div class="poem-preview"><strong>${p.core_title}</strong></div>
            </div>
            <div class="card-footer">點擊查看錦囊 →</div>
          </div>
        `).join('');
        return;
      }

      const filtered = POEMS_DATA.filter(p => {
        return p.id.toString() === query ||
               p.header.toLowerCase().includes(query) ||
               p.core_title.toLowerCase().includes(query) ||
               p.core_desc.toLowerCase().includes(query) ||
               p.orig.some(l => l.toLowerCase().includes(query)) ||
               p.articles.some(a => a.title.toLowerCase().includes(query));
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">未找到符合條件的成人籤詩，請嘗試其他關鍵字</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="poem-card" onclick="openModal(${p.id})">
          <div>
            <div class="card-header">
              <span class="poem-title">${p.header}</span>
              <span class="poem-tag">${p.category}</span>
            </div>
            <div class="poem-preview"><strong>${p.core_title}</strong></div>
          </div>
          <div class="card-footer">點擊查看錦囊 →</div>
        </div>
      `).join('');
    }

    function drawPoem() {
      const tube = document.getElementById('tube-icon');
      tube.classList.add('shaking');
      
      setTimeout(() => {
        tube.classList.remove('shaking');
        const randomId = Math.floor(Math.random() * POEMS_DATA.length) + 1;
        openModal(randomId);
      }, 1000);
    }

    function openModal(id) {
      const p = POEMS_DATA.find(x => x.id === id);
      if (!p) return;
      currentPoem = p;

      document.getElementById('m-cat').innerText = p.category;
      document.getElementById('m-header').innerText = p.header;

      const transList = document.getElementById('m-trans');
      transList.innerHTML = p.orig.map((o, idx) => `
        <li class="trans-item">
          <div class="trans-orig">${o}</div>
          <div class="trans-explain">${p.trans[idx] || ''}</div>
        </li>
      `).join('');

      document.getElementById('m-core-title').innerText = p.core_title;
      document.getElementById('m-core-desc').innerText = p.core_desc;

      const artBox = document.getElementById('m-articles');
      artBox.innerHTML = p.articles.map(a => `
        <div class="article-box">
          <div class="article-title">📄 《${a.title}》 （${a.year}）</div>
        </div>
      `).join('');

      document.getElementById('modal-overlay').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    }

    function copyPrescription() {
      if (!currentPoem) return;
      const articleLines = currentPoem.articles.map(a => `• 《${a.title}》（${a.year}）`).join('\n');
      const text = `【${currentPoem.header}】 成人 ADHD 心智錦囊\n核心指引：${currentPoem.core_title}\n說明：${currentPoem.core_desc}\n\n建議延伸閱讀文章：\n` + articleLines;

      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
