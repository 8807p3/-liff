<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORA D40b 數據中心</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 30px; }
        .status { padding: 12px; margin-bottom: 20px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.1em; }
        .idle { background: #e8eaed; color: #5f6368; }
        .connected { background: #e6f4ea; color: #1e8e3e; }
        .error { background: #fce8e6; color: #d93025; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        button { padding: 12px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; transition: 0.2s; font-weight: 600; }
        .btn-primary { background-color: #1a73e8; color: white; }
        .btn-secondary { background-color: #34a853; color: white; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #f8f9fa; color: #5f6368; }
        tr:nth-child(even) { background-color: #fafafa; }
        #log { margin-top: 20px; background: #202124; color: #8ab4f8; padding: 15px; border-radius: 8px; height: 150px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>FORA D40b 數據擷取系統</h1>
    
    <div id="statusIndicator" class="status idle">等待藍牙連線...</div>
    
    <div class="controls">
        <button id="scanBtn" class="btn-primary">1. 掃描並配對新裝置</button>
        <button id="reconnectBtn" class="btn-primary" disabled>2. 重新連線 (原裝置)</button>
        <button id="historyBtn" class="btn-secondary" disabled>3. 讀取過去 5 筆紀錄</button>
    </div>

    <h3>最近 5 筆測量數據</h3>
    <table id="recordTable">
        <thead>
            <tr>
                <th>測量時間</th>
                <th>類型</th>
                <th>收縮壓 (SYS)</th>
                <th>舒張壓 (DIA)</th>
                <th>脈搏 (Pulse)</th>
                <th>血糖 (GLU)</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="7">暫無數據</td></tr>
        </tbody>
    </table>

    <h4>系統通訊日誌：</h4>
    <div id="log">請開啟手機/電腦藍牙，並將 D40b 切換至傳輸模式。</div>
</div>

<script>
    let currentDevice = null;
    let gattServer = null;
    let records = [];

    const scanBtn = document.getElementById('scanBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const historyBtn = document.getElementById('historyBtn');
    const logElement = document.getElementById('log');
    const statusIndicator = document.getElementById('statusIndicator');
    const tableBody = document.getElementById('tableBody');

    function log(message) {
        const now = new Date().toLocaleTimeString();
        logElement.innerHTML += `[${now}] ${message}<br>`;
        logElement.scrollTop = logElement.scrollHeight;
    }

    // 更新表格顯示
    function updateTable() {
        if (records.length === 0) return;
        const last5 = records.slice(-5).reverse(); // 取最後五筆並倒序
        tableBody.innerHTML = last5.map(r => `
            <tr>
                <td>${r.timestamp || '--'}</td>
                <td>${r.type}</td>
                <td>${r.sys || '--'}</td>
                <td>${r.dia || '--'}</td>
                <td>${r.pulse || '--'}</td>
                <td>${r.glu || '--'}</td>
                <td>
                    <button onclick="copyBP('${r.sys}', '${r.dia}', '${r.pulse}', this)" style="padding: 6px 12px; font-size: 13px; background-color: #6c757d; color: white;">COPY</button>
                </td>
            </tr>
        `).join('');
    }

    // 執行連線與設定監聽的共用邏輯
    async function connectToDevice(device) {
        try {
            log(`準備連線至: ${device.name}`);
            statusIndicator.innerText = "連線中...";
            gattServer = await device.gatt.connect();
            log("連線成功");
            if (statusIndicator) {
                statusIndicator.innerText = "已連線";
                statusIndicator.className = "status connected";
            }
            if (historyBtn) historyBtn.disabled = false;
            if (reconnectBtn) reconnectBtn.disabled = true; // 已經連線中，禁用重連按鈕

            // 設置即時監聽 (血壓)
            const bpService = await gattServer.getPrimaryService('blood_pressure');
            const bpChar = await bpService.getCharacteristic('blood_pressure_measurement');
            await bpChar.startNotifications();
            bpChar.addEventListener('characteristicvaluechanged', (e) => parseData(e, '血壓'));

        } catch (error) {
            log("連線錯誤: " + error);
            if (statusIndicator) {
                statusIndicator.innerText = "連線失敗";
                statusIndicator.className = "status error";
            }
            if (reconnectBtn) reconnectBtn.disabled = false;
        }
    }

    // 1. 首次掃描並綁定裝置
    async function onScanClick() {
        try {
            log("正在請求藍牙裝置清單...");
            currentDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'FORA' }],
                optionalServices: ['blood_pressure', 'glucose']
            });

            log(`已配對並記住新裝置: ${currentDevice.name}`);
            
            // 監聽斷線事件
            currentDevice.addEventListener('gattserverdisconnected', () => {
                if (statusIndicator) {
                    statusIndicator.innerText = "已斷線";
                    statusIndicator.className = "status error";
                }
                if (historyBtn) historyBtn.disabled = true;
                if (reconnectBtn) reconnectBtn.disabled = false; // 斷線後允許點擊重連
                log("裝置已經休眠或斷線。若要讀取下一位，請喚醒儀器並點擊「重新連線」");
            });

            await connectToDevice(currentDevice);
        } catch (error) {
            log("掃描/連線錯誤: " + error);
        }
    }

    // 2. 針對已配對裝置重新連線
    async function onReconnectClick() {
        if (!currentDevice) {
            log("尚未配對任何裝置，請先點擊「掃描並配對」");
            return;
        }
        log("嘗試與原裝置重新連線...");
        await connectToDevice(currentDevice);
    }

    // 解析數據邏輯 (包含血壓、時間與脈搏)
    function parseData(event, type) {
        const data = event.target.value;
        const flags = data.getUint8(0);
        let record = { type: type, sys: null, dia: null, pulse: null, glu: null, timestamp: null };

        if (type === '血壓') {
            record.sys = Math.round(data.getUint16(1, true));
            record.dia = Math.round(data.getUint16(3, true));

            // 檢查 Flag 位元
            const hasTimestamp = flags & 0x02; // Bit 1: 是否有時間戳記
            const hasPulse = flags & 0x04;     // Bit 2: 是否有脈搏

            if (hasTimestamp) {
                // 藍牙標準時間戳記長度為 7 Byte，起始於 offset 7
                const year = data.getUint16(7, true);
                const month = data.getUint8(9);
                const day = data.getUint8(10);
                const hours = data.getUint8(11);
                const min = data.getUint8(12);
                
                // 格式化為 YYYY-MM-DD HH:mm
                const fMo = month.toString().padStart(2, '0');
                const fD = day.toString().padStart(2, '0');
                const fH = hours.toString().padStart(2, '0');
                const fMi = min.toString().padStart(2, '0');
                record.timestamp = `${year}-${fMo}-${fD} ${fH}:${fMi}`;
            }

            if (hasPulse) {
                // 如果有時間戳記(7位元組)，脈搏位置會往後移
                // 無時間戳記時位移量是 7，有時間戳記時是 7 + 7 = 14
                let pulseOffset = hasTimestamp ? 14 : 7;
                record.pulse = data.getUint16(pulseOffset, true);
            }
        }
    
        log(`讀取到新數據: ${type}`);
        records.push(record);
        updateTable();
    }




    // 讀取歷史紀錄 (使用 RACP)
    async function onHistoryClick() {
        try {
            log("正在發送歷史紀錄讀取指令 (RACP)...");
            let racpChar = null;

            try {
                // 注意：標準藍牙血壓服務 (Blood Pressure, 0x1810) 本身「不包含」RACP (0x2A52) 特徵值。
                // 如果是 FORA 二合一裝置，RACP 通常實作於血糖服務 (Glucose, 0x1808) 中。
                const glucoseService = await gattServer.getPrimaryService('glucose');
                racpChar = await glucoseService.getCharacteristic(0x2A52);
                log("在血糖服務找到 RACP (0x2A52)，準備讀取...");
            } catch (e) {
                log("提示：此裝置標準服務未提供 RACP (不支援手動讀取歷史指令)。");
                log("請改變操作方式：先將機器關機（這時會正常斷線），接著長按機器上的『M鍵/藍牙鍵』直到顯示 PCL 或進入傳輸模式。");
                log("最後，在網頁上方點選「2. 重新連線 (原裝置)」，連線成功後機器就會自動推播內存的所有歷史數據了！");
                return;
            }

            if (racpChar) {
                await racpChar.startNotifications();
                racpChar.addEventListener('characteristicvaluechanged', (e) => {
                    log("收到 RACP 控制封包回傳");
                });

                // 指令: 0x01 (Report) 0x01 (All Records) 
                if (racpChar.writeValueWithResponse) {
                    await racpChar.writeValueWithResponse(new Uint8Array([0x01, 0x01]));
                } else {
                    await racpChar.writeValue(new Uint8Array([0x01, 0x01]));
                }
                log("指令已發送，請觀察數據更新");
            }
        } catch (error) {
            log("讀取歷史失敗: " + error);
        }
    }

    // 複製數據到剪貼簿
    window.copyBP = function(sys, dia, pulse, btn) {
        if (!sys || sys === 'null' || sys === '--') {
            alert('沒有收縮壓數據可複製');
            return;
        }
        
        const text = `BP ${sys}/${dia} Pulse ${pulse}`;
        navigator.clipboard.writeText(text).then(() => {
            const oldText = btn.innerText;
            const oldBg = btn.style.backgroundColor;
            
            btn.innerText = "已複製!";
            btn.style.backgroundColor = "#28a745"; // 變成綠色
            
            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.backgroundColor = oldBg;
            }, 1500);
        }).catch(err => {
            console.error('複製失敗:', err);
            alert('複製失敗，請手動框選複製');
        });
    };

    if (scanBtn) scanBtn.addEventListener('click', onScanClick);
    if (reconnectBtn) reconnectBtn.addEventListener('click', onReconnectClick);
    if (historyBtn) historyBtn.addEventListener('click', onHistoryClick);
</script>

</body>
</html>
